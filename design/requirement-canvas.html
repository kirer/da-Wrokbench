<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="web">
<title>需求画布 · DSH 研发工作台</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
/* =====================================================================
   需求画布 · 全宽需求工作区
   一张页面同时承载：需求状态、原型 / 设计画布、每个人的会话与动态
   ===================================================================== */

:root {
  --dock-w: 372px;
  --canvas-dot: rgba(255, 255, 255, .065);
  --ab-shadow: 0 26px 70px -30px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .055);
}
html[data-theme="light"] {
  --canvas-dot: rgba(20, 28, 45, .09);
  --ab-shadow: 0 24px 60px -34px rgba(15, 23, 42, .45), 0 0 0 1px rgba(15, 23, 42, .07);
}

body { overflow: hidden; }
button { cursor: pointer; }
.ic { width: 15px; height: 15px; flex: none; }
.ic-sm { width: 13px; height: 13px; flex: none; }
.mono { font-family: var(--font-mono); }

/* ============================== 外壳 ============================== */
.app-shell { display: flex; height: 100vh; min-width: 960px; background: var(--bg); color: var(--text); overflow: hidden; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.gbar {
  width: 52px; flex: none; background: var(--bg-elev); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; gap: 5px;
}
.glogo {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line-2); color: var(--text); margin-bottom: 9px;
}
.glogo svg { width: 19px; height: 19px; }
.gbtn {
  width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent;
  color: var(--text-3); display: grid; place-items: center; position: relative;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.gbtn:hover { color: var(--text); background: var(--surface-2); }
.gbtn.active { color: var(--primary); background: var(--primary-bg); }
.gbtn .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px var(--bg-elev); }
.gsp { flex: 1; }
.gavatar { border: 0; background: transparent; padding: 0; border-radius: 50%; margin-top: 2px; }
.gavatar .avatar { width: 26px; height: 26px; font-size: 10px; }

/* ============================== 顶栏 ============================== */
.c-top {
  height: 54px; flex: none; display: flex; align-items: center; gap: 7px;
  padding: 0 14px; background: var(--bg-elev); border-bottom: 1px solid var(--line);
}
.iter-btn {
  display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 9px;
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  border-radius: var(--r-sm); font-size: var(--fs-12); min-width: 0;
}
.iter-btn:hover { background: var(--surface-2); border-color: var(--line); }
.iter-k { font-size: 10px; color: var(--text-3); letter-spacing: .05em; }
.iter-nm { color: var(--text); font-weight: var(--fw-med); white-space: nowrap; }
.iter-btn .ic { color: var(--text-3); width: 13px; height: 13px; }
.crumb { color: var(--text-4); font-size: 12px; }
.req-btn {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 9px;
  border: 1px solid transparent; background: transparent; border-radius: var(--r-sm); min-width: 0;
}
.req-btn:hover { background: var(--surface-2); border-color: var(--line); }
.req-code { color: var(--text-3); font-size: var(--fs-11); }
.req-name { font-weight: var(--fw-semi); font-size: var(--fs-13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
.req-btn .ic { color: var(--text-3); width: 13px; height: 13px; }
.chip .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.tb-spacer { flex: 1; }

.tb-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px;
  border: 1px solid transparent; background: transparent; border-radius: var(--r-sm);
  color: var(--text-2); font-size: var(--fs-12); position: relative;
}
.tb-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.tb-btn .ic { color: var(--text-3); }
.tb-btn.icon { width: 32px; padding: 0; justify-content: center; }
.tb-btn .count {
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-pill);
  background: var(--surface-3); color: var(--text-2); font-family: var(--font-mono);
  font-size: 10px; display: inline-grid; place-items: center;
}
.tb-btn .dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg-elev); }

.team-stack { display: flex; align-items: center; padding-left: 4px; }
.team-stack .avatar { width: 23px; height: 23px; font-size: 9px; border: 2px solid var(--bg-elev); margin-left: -7px; }
.team-stack .avatar:first-child { margin-left: 0; }
.tb-sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 3px; }
.id-btn {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px;
  border: 1px solid transparent; background: transparent; border-radius: var(--r-sm); color: var(--text);
}
.id-btn:hover { background: var(--surface-2); border-color: var(--line); }
.id-txt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.15; }
.id-txt b { font-size: var(--fs-12); font-weight: var(--fw-semi); }
.id-txt small { font-size: 10px; color: var(--text-3); white-space: nowrap; }
.id-btn .ic { width: 13px; height: 13px; color: var(--text-3); }
.act-btn { margin-left: 4px; height: 32px; font-size: var(--fs-12); }

/* ============================== 阶段条 ============================== */
.c-stages {
  height: 66px; flex: none; display: flex; align-items: center; gap: 1px;
  padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); overflow: hidden;
}
.c-stage {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px 7px 8px; border-radius: 9px;
  border: 1px solid transparent; background: transparent; color: var(--text-2); flex: none;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.c-stage:hover { background: var(--surface); }
.c-stage.active { background: var(--surface-2); border-color: var(--line-2); box-shadow: var(--shadow-1); }
.c-stage-ico {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; position: relative;
  background: var(--surface); border: 1px solid var(--line-2); color: var(--text-3);
}
.c-stage-ico .ic { width: 15px; height: 15px; }
.c-stage.done .c-stage-ico { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
.c-stage.doing .c-stage-ico { color: var(--primary); background: var(--primary-bg); border-color: var(--primary-line); }
.c-stage.active.done .c-stage-ico { color: var(--green); }
.c-stage.active.doing .c-stage-ico { color: var(--primary); }
.c-stage.block .c-stage-ico { color: var(--red); background: var(--red-bg); border-color: var(--red-line); }
.c-stage-ico .stdot { position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--bg); background: var(--text-4); }
.c-stage.done .stdot { background: var(--green); }
.c-stage.doing .stdot { background: var(--primary); animation: breathe 2.4s infinite; }
.c-stage.block .stdot { background: var(--red); }
.c-stage-txt { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; line-height: 1.15; }
.c-stage-name { font-size: 12.5px; font-weight: var(--fw-med); color: var(--text-2); white-space: nowrap; }
.c-stage.active .c-stage-name { color: var(--text); }
.c-stage-sub { font-size: 10.5px; color: var(--text-3); white-space: nowrap; font-family: var(--font-sans); }
.c-stage-sep { color: var(--text-4); font-size: 12px; padding: 0 2px; flex: none; }
.stage-hint {
  margin-left: auto; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px; flex: none; max-width: 380px;
}
.stage-hint:hover { border-color: var(--line-3); background: var(--surface-2); }
.hint-ico { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--violet-bg); color: var(--violet); flex: none; }
.hint-ico .ic { width: 13px; height: 13px; }
.hint-txt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
.hint-txt b { font-size: 9.5px; letter-spacing: .05em; color: var(--text-3); font-weight: var(--fw-med); }
.hint-txt span { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ============================== 工作区 ============================== */
.c-work { flex: 1; min-height: 0; display: flex; position: relative; }
.c-canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.c-chead {
  height: 54px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; overflow: hidden;
}
.c-chead-l { display: flex; align-items: center; gap: 9px; min-width: 0; }
.c-chead-l h2 { font-size: var(--fs-16); font-weight: var(--fw-semi); letter-spacing: -.01em; margin: 0; white-space: nowrap; }
.c-meta { font-size: 10.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.perm {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
  border-radius: var(--r-xs); background: var(--surface-2); color: var(--text-3);
  font-size: 10px; white-space: nowrap; border: 1px solid var(--line);
}
.perm .ic { width: 11px; height: 11px; }
.perm.ok { color: var(--primary); background: var(--primary-bg); border-color: var(--primary-line); }
.c-chead-r { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: none; }
.tbtn {
  display: inline-flex; align-items: center; gap: 5px; height: 27px; padding: 0 8px;
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  border-radius: var(--r-xs); font-size: 11px; white-space: nowrap;
}
.tbtn:hover { background: var(--surface-2); border-color: var(--line); color: var(--text); }
.tbtn .ic { width: 13px; height: 13px; color: var(--text-3); }
.tbtn.on { background: var(--primary-bg); border-color: var(--primary-line); color: var(--primary); }
.tbtn.on .ic { color: var(--primary); }
.tbtn.primary { background: var(--primary-strong); border-color: var(--primary-strong); color: #fff; }
.tbtn.primary .ic { color: #fff; }
.tbtn:disabled { opacity: .42; cursor: not-allowed; }
.tsep { width: 1px; height: 18px; background: var(--line-2); margin: 0 3px; }
.zoom-group { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-xs); overflow: hidden; }
.zoom-group button { height: 25px; width: 24px; border: 0; background: transparent; color: var(--text-3); display: grid; place-items: center; }
.zoom-group button:hover { background: var(--surface-2); color: var(--text); }
.zoom-group button.fit { width: auto; padding: 0 7px; font-size: 10.5px; color: var(--text-2); }
.zoom-group .zval { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); min-width: 34px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 25px; }

.c-cbody {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
  background-size: 18px 18px;
}

/* ============================== 设计 / 原型画布 ============================== */
.dv { display: flex; height: 100%; min-height: 0; }
.dv-rail {
  width: 194px; flex: none; border-right: 1px solid var(--line); overflow: auto;
  padding: 13px 11px 20px; background: color-mix(in srgb, var(--bg) 84%, transparent);
}
.dv-rail-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 10.5px; color: var(--text-3); padding: 1px 4px 9px;
}
.dv-item {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px;
  border: 1px solid transparent; background: transparent; border-radius: var(--r-sm);
  text-align: left;
}
.dv-item + .dv-item { margin-top: 2px; }
.dv-item:hover { background: var(--surface); }
.dv-item.active { background: var(--surface-2); border-color: var(--line-2); }
.dv-thumb {
  width: 46px; height: 56px; flex: none; border-radius: 4px; overflow: hidden; position: relative;
  background: #eef1f6; border: 1px solid rgba(12, 18, 30, .16); padding: 4px;
  display: flex; flex-direction: column; gap: 3px;
}
.dv-thumb .tb { background: #cfd7e4; border-radius: 2px; height: 3px; }
.dv-thumb .tb.dark { background: #aeb9c9; }
.dv-thumb .tb.hero { height: 10px; background: #d8e2f4; border-radius: 3px; }
.dv-thumb .tb.line { height: 2px; background: #dbe1ea; }
.dv-thumb .tb.row { height: 5px; background: #fff; border: 1px solid #e2e7ef; border-radius: 1.5px; }
.dv-thumb .tb.gap { background: transparent; }
.dv-thumb.web.filter .tb-drawer { position: absolute; right: 2px; top: 13px; bottom: 4px; width: 14px; background: #fff; border: 1px solid #c9d2e0; border-radius: 2px; box-shadow: -5px 0 0 rgba(15, 23, 42, .10); }
.dv-thumb.web.empty .tb-dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px dashed #b9c3d2; margin: 12px auto 3px; }
.dv-thumb.phone { width: 32px; height: 56px; border-radius: 6px; padding: 3px 4px; }
.dv-thumb.phone .tb.hero { height: 7px; }
.dv-thumb.phone .tb-dot { width: 8px; height: 8px; border-radius: 50%; background: #d3dceb; margin: 2px auto; }
.dv-itxt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dv-iname { font-size: 11.5px; font-weight: var(--fw-med); color: var(--text-2); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-item.active .dv-iname { color: var(--text); }
.dv-imeta { font-size: 9.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag-new { font-size: 8px; color: var(--violet); background: var(--violet-bg); border: 1px solid var(--violet-line); border-radius: 3px; padding: 0 3px; line-height: 13px; flex: none; }
.dv-rail-note {
  margin: 13px 4px 0; padding-top: 11px; border-top: 1px solid var(--line);
  font-size: 9.5px; color: var(--text-3); line-height: 1.5; display: flex; gap: 5px; align-items: flex-start;
}
.dv-rail-note .ic { width: 11px; height: 11px; margin-top: 1px; }

.stage-scroll { flex: 1; min-width: 0; overflow: auto; padding: 20px 26px 60px; }
.stage-inner { display: flex; flex-direction: column; align-items: center; min-width: min-content; }
.ab-wide { align-self: center; }
.stage-banner {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface); font-size: 11px; color: var(--text-2);
  margin-bottom: 13px;
}
.stage-banner .ic { width: 14px; height: 14px; color: var(--text-3); }
.stage-banner.good { border-color: var(--green-line); background: var(--green-bg); color: var(--green); }
.stage-banner.good .ic { color: var(--green); }
.stage-banner.warn { border-color: var(--amber-line); background: var(--amber-bg); color: #d9ad63; }
.stage-banner.warn .ic { color: var(--amber); }
.stage-banner .grow { flex: 1; }
.stage-banner button { height: 22px; padding: 0 7px; border-radius: var(--r-xs); border: 1px solid currentColor; background: transparent; color: inherit; font-size: 10px; opacity: .9; }
.stage-banner button:hover { opacity: 1; background: rgba(255, 255, 255, .05); }

.ab-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--text-3); font-size: 10px; }
.ab-label .nm { font-size: 11.5px; font-weight: var(--fw-semi); color: var(--text-2); }
.ab-label .dim { font-family: var(--font-mono); font-size: 9.5px; }
.ab-label .r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ab-label .who { display: inline-flex; align-items: center; gap: 4px; }
.ab-label .who .avatar { width: 15px; height: 15px; font-size: 7px; border: 0; }
.ab-zoom { width: max-content; }
.ab {
  width: 720px; background: #f4f6f9; border-radius: 7px; position: relative;
  box-shadow: var(--ab-shadow); color: #1c2330;
  font-family: "Inter", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4; overflow: hidden;
}
.ab.phone { width: 375px; border-radius: 16px; background: #f5f6f8; height: 812px; }
.ab.lofi { background: #fbfbfc; }

/* 画板上的评论钉 */
.pin {
  position: absolute; z-index: 6; width: 22px; height: 22px; border-radius: 50%;
  background: var(--primary-strong); color: #fff; border: 2px solid #fff;
  font-size: 9px; font-weight: 700; display: grid; place-items: center;
  box-shadow: 0 4px 12px rgba(12, 30, 70, .35); transform: translate(-50%, -50%);
}
.pin.resolved { background: var(--green); }
.pin:hover { transform: translate(-50%, -50%) scale(1.08); }
.pin-card {
  position: absolute; z-index: 7; width: 244px; background: #fff; color: #1b2433;
  border-radius: 8px; box-shadow: 0 18px 40px -12px rgba(15, 23, 42, .38), 0 0 0 1px rgba(15, 23, 42, .08);
  padding: 10px 11px; font-size: 10.5px; line-height: 1.55;
}
.pin-card.flip { transform: translateX(calc(-100% - 16px)); }
.pin-card .pch { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.pin-card .pch .avatar { width: 17px; height: 17px; font-size: 8px; border: 0; }
.pin-card .pch b { font-size: 10.5px; }
.pin-card .pch .t { color: #98a3b2; font-size: 9px; margin-left: auto; }
.pin-card .ptx { color: #3d4a5d; }
.pin-card .pft { display: flex; align-items: center; gap: 8px; margin-top: 7px; padding-top: 7px; border-top: 1px solid #eef1f6; }
.pin-card .pft span { color: #0d9b68; font-size: 9px; flex: 1; }
.pin-card .pft button { border: 0; background: #f2f5fa; color: #3d4a5d; border-radius: 4px; font-size: 9px; height: 20px; padding: 0 6px; }
.pin-card .pft button:hover { background: #e7ecf4; }
.pin-card .pclose { position: absolute; right: 7px; top: 6px; border: 0; background: transparent; color: #a6afbd; font-size: 13px; line-height: 1; padding: 2px; }

/* 总览 */
.ov { height: 100%; overflow: auto; padding: 20px 26px 50px; }
.ov-hd { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--text-3); margin-bottom: 16px; }
.ov-hd .grow { flex: 1; }
.ov-grid { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; }
.ov-card { cursor: pointer; }
.ov-card .ab { box-shadow: var(--ab-shadow); }
.ov-card:hover .ab { outline: 2px solid var(--primary-line); }
.ov-card.active .ab { outline: 2px solid var(--primary); }
.ov-cap { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font-size: 10.5px; color: var(--text-2); }
.ov-cap .num { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); }
.ov-cap .chip { margin-left: auto; }

/* 对比 */
.cmp { height: 100%; overflow: auto; padding: 18px 24px 50px; }
.cmp-note {
  display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-2);
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm);
  padding: 8px 11px; margin: 0 auto 16px; max-width: 760px;
}
.cmp-note .ic { color: var(--violet); }
.cmp-note b { color: var(--text); font-weight: var(--fw-med); }
.cmp-row { display: flex; gap: 18px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.cmp-pane { max-width: 100%; }
.cmp-hd { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font-size: 10.5px; color: var(--text-3); }
.cmp-hd b { font-size: 11px; color: var(--text-2); font-weight: var(--fw-semi); }
.cmp-hd .chip { margin-left: 2px; }

/* ============================== 画板 · Web 高保真 ============================== */
.ab-web { min-height: 664px; background: #f4f6f9; }
.w-page { position: relative; min-height: 664px; }
.w-nav { height: 50px; background: #fff; border-bottom: 1px solid #eceff4; display: flex; align-items: center; gap: 20px; padding: 0 24px; }
.w-brand { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: #121a26; letter-spacing: -.01em; white-space: nowrap; }
.w-logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(140deg, #3a72ff, #7ea4ff); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }

  margin: 14px 0 0; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--violet-line);
  background: var(--violet-bg); font-size: 12px; color: var(--text-2); line-height: 1.65;
}
.doc-quote .qh { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; color: var(--violet); font-size: 10px; }
.doc-quote .qh .avatar { width: 16px; height: 16px; font-size: 7px; border: 0; }
.crit-list { display: flex; flex-direction: column; gap: 7px; }
.crit {
  display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px;
  border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 12px; color: var(--text-2); line-height: 1.55;
}
.crit .cb { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line-3); flex: none; margin-top: 1px; display: grid; place-items: center; }
.crit .cb .ic { width: 9px; height: 9px; }
.crit.pass .cb { background: var(--green); border-color: var(--green); color: #04130c; }
.crit .st { margin-left: auto; flex: none; }

.doc-side { display: flex; flex-direction: column; gap: 11px; }
.side-card { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 12px; }
.side-card h4 { margin: 0 0 7px; font-size: 9.5px; letter-spacing: .06em; color: var(--text-3); font-weight: var(--fw-semi); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11px; padding: 4px 0; }
.kv .k { color: var(--text-3); }
.kv .v { color: var(--text-2); text-align: right; display: flex; align-items: center; gap: 5px; }
.side-link {
  display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 4px;
  border: 0; background: transparent; color: var(--text-2); font-size: 11px; border-radius: 5px; text-align: left;
}
.side-link:hover { background: var(--surface-2); color: var(--text); }
.side-link .ic { width: 13px; height: 13px; color: var(--text-3); }
.side-link .r { margin-left: auto; font-size: 9.5px; color: var(--text-3); }
.side-card .avatars { display: flex; align-items: center; gap: 5px; }
.side-card .avatars .avatar { width: 21px; height: 21px; font-size: 8px; }
.side-card .avatars span.nm { font-size: 10px; color: var(--text-3); margin-left: 3px; }

.doc-changes { display: flex; flex-direction: column; gap: 12px; border-left: 1px solid var(--line-2); padding-left: 14px; }
.change { position: relative; font-size: 11px; color: var(--text-3); line-height: 1.55; }
.change::before { content: ""; position: absolute; left: -18px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); border: 1.5px solid var(--line-3); }
.change b { color: var(--text-2); font-weight: var(--fw-med); }

/* ============================== 开发交接 ============================== */
.dev-scroll, .rev-scroll { height: 100%; overflow: auto; padding: 24px 30px 70px; }
.dev, .rev { width: min(860px, 100%); margin: 0 auto; }
.page-hd { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 17px; }
.page-hd .t { min-width: 0; }
.page-hd h2 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
.page-hd p { margin: 0; font-size: 11.5px; color: var(--text-3); }
.page-hd .r { margin-left: auto; display: flex; gap: 7px; align-items: center; flex: none; }
.panel { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; margin-bottom: 13px; }
.panel-hd { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--line); }
.panel-hd .t { font-size: 11.5px; font-weight: var(--fw-semi); }
.panel-hd .ic { width: 14px; height: 14px; color: var(--text-3); }
.panel-hd .r { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-3); }
.panel-bd { padding: 13px; }
.handoff-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.hs { padding: 12px 13px; border-right: 1px solid var(--line); }
.hs:last-child { border-right: 0; }
.hs .lab { font-size: 9.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.hs .v { font-family: var(--font-mono); font-size: 16px; font-weight: 650; color: var(--text); margin-top: 4px; letter-spacing: -.02em; }
.hs .d { font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
.flow-row { display: flex; align-items: center; gap: 12px; padding: 10px 13px; border-bottom: 1px solid var(--line); }
.flow-row:last-child { border-bottom: 0; }
.flow-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); flex: none; }
.flow-ico .ic { width: 13px; height: 13px; }
.flow-main { min-width: 0; }
.flow-t { font-size: 11.5px; color: var(--text-2); font-weight: var(--fw-med); }
.flow-s { font-size: 10px; color: var(--text-3); margin-top: 1px; font-family: var(--font-mono); }
.flow-r { margin-left: auto; display: flex; align-items: center; gap: 7px; flex: none; }
.dev-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.dev-note { font-size: 10px; color: var(--text-3); line-height: 1.6; margin-top: 8px; }

/* ============================== 验收 ============================== */
.rev-banner {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 9px;
  border: 1px solid var(--line-2); background: var(--surface); font-size: 11.5px; color: var(--text-2); margin-bottom: 13px;
}
.rev-banner .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--text-3); }
.rev-banner .ico .ic { width: 15px; height: 15px; }
.rev-banner.good { border-color: var(--green-line); background: var(--green-bg); color: var(--green); }
.rev-banner.good .ico { background: rgba(34, 197, 94, .14); color: var(--green); }
.rev-banner.warn { border-color: var(--amber-line); background: var(--amber-bg); color: #d9ad63; }
.rev-banner.warn .ico { background: rgba(245, 176, 65, .13); color: var(--amber); }
.rev-banner .b { font-weight: var(--fw-semi); color: var(--text); }
.rev-banner .r { margin-left: auto; display: flex; gap: 6px; flex: none; }
.rev-list { display: flex; flex-direction: column; }
.rev-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-bottom: 1px solid var(--line); }
.rev-item:last-child { border-bottom: 0; }
.rev-item .box { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--line-3); display: grid; place-items: center; flex: none; margin-top: 1px; color: transparent; }
.rev-item .box .ic { width: 10px; height: 10px; }
.rev-item.pass .box { background: var(--green); border-color: var(--green); color: #04130c; }
.rev-item.warn .box { border-color: var(--amber); color: var(--amber); }
.rev-item .rm { min-width: 0; }
.rev-item .rt { font-size: 12px; color: var(--text); line-height: 1.5; }
.rev-item .rs { font-size: 10px; color: var(--text-3); margin-top: 2px; line-height: 1.5; }
.rev-item .rr { margin-left: auto; flex: none; display: flex; gap: 5px; }
.rev-thumbs { display: flex; gap: 9px; padding: 11px 13px; }
.rev-th {
  border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface-2); overflow: hidden;
  width: 104px; flex: none; text-align: left; padding: 0;
}
.rev-th:hover { border-color: var(--primary-line); }
.rev-th .rtn { font-size: 9.5px; color: var(--text-3); padding: 5px 7px; display: flex; align-items: center; gap: 4px; }
.rev-th .rimg { height: 66px; background: linear-gradient(180deg, #e3e9f2, #dbe2ed); padding: 7px; display: flex; flex-direction: column; gap: 4px; }
.rev-th .rimg.mini { background: linear-gradient(180deg, #dfe6f0, #d3dcea); }
.rev-th .rimg i { display: block; background: #c2ccda; border-radius: 2px; height: 4px; }
.rev-th .rimg i:nth-child(1) { width: 42%; background: #9dabc0; height: 5px; }
.rev-th .rimg i:nth-child(2) { height: 20px; background: #cfdcef; border: 1px solid #b9c8de; }
.rev-th .rimg i:nth-child(3) { width: 74%; }
.rev-th .rimg i:nth-child(4) { width: 88%; }
.rev-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.rev-foot .grow { flex: 1; }
.rev-note { font-size: 10px; color: var(--text-3); }

/* ============================== 会话坞 ============================== */
.c-dock {
  width: var(--dock-w); flex: none; border-left: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0; position: relative;
}
.c-work.dock-collapsed .c-dock { display: none; }
.dock-mini {
  display: none; position: absolute; right: 12px; top: 66px; z-index: 25;
  width: 38px; height: 72px; border-radius: 9px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--text-2); box-shadow: var(--shadow-2);
  flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 10px;
}
.c-work.dock-collapsed .dock-mini { display: flex; }
.dock-mini:hover { border-color: var(--primary-line); color: var(--primary); }
.dock-head { height: 54px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); }
.dock-head .avatar { width: 29px; height: 29px; font-size: 11px; }
.dock-id { min-width: 0; }
.dock-name { display: flex; align-items: center; gap: 5px; line-height: 1.2; }
.dock-name b { font-size: 12.5px; font-weight: var(--fw-semi); }
.dock-you { font-size: 8.5px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; line-height: 13px; }
.dock-sess { font-size: 9.5px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.dock-sess .live { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex: none; }
.dock-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.dock-actions button { width: 26px; height: 26px; border: 0; border-radius: 5px; background: transparent; color: var(--text-3); display: grid; place-items: center; }
.dock-actions button:hover { background: var(--surface-2); color: var(--text); }
.dock-tabs { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.dock-tab { height: 36px; padding: 0 8px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-3); font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: -1px; }
.dock-tab:hover { color: var(--text-2); }
.dock-tab.active { color: var(--text); border-bottom-color: var(--primary); font-weight: var(--fw-med); }
.dock-tab .n { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); }
.dock-scope { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-3); }
.dock-scope .ic { width: 10px; height: 10px; }
.dock-body { flex: 1; min-height: 0; overflow: auto; padding: 13px 14px 18px; display: flex; flex-direction: column; gap: 13px; }
.dock-body.scrolled {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
}
.dock-compose { flex: none; border-top: 1px solid var(--line); padding: 9px 12px 11px; }
.ctx-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
.ctx-chip { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-3); font-size: 9.5px; }
.ctx-chip .ic { width: 9px; height: 9px; }
.compose-box { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; overflow: hidden; transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease); }
.compose-box:focus-within { border-color: var(--primary-line); box-shadow: 0 0 0 3px var(--primary-bg); }
.compose-box textarea { display: block; width: 100%; min-height: 44px; max-height: 130px; resize: none; border: 0; background: transparent; color: var(--text); font-family: inherit; font-size: 12px; line-height: 1.6; padding: 9px 10px 4px; outline: none; }
.compose-box textarea::placeholder { color: var(--text-3); }
.compose-bar { display: flex; align-items: center; gap: 2px; padding: 2px 6px 6px 6px; }
.compose-bar .ibtn { width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--text-3); display: grid; place-items: center; }
.compose-bar .ibtn:hover { background: var(--surface-2); color: var(--text-2); }
.compose-bar .ibtn .ic { width: 13px; height: 13px; }
.compose-bar .sp { flex: 1; }
.model-lbl { font-family: var(--font-mono); font-size: 8.5px; color: var(--text-4); margin-right: 5px; }
.send-btn { width: 25px; height: 25px; border-radius: 6px; border: 1px solid var(--primary-strong); background: var(--primary-strong); color: #fff; display: grid; place-items: center; }
.send-btn:hover { background: var(--primary-strong-h); }
.send-btn:disabled { opacity: .4; cursor: default; }
.send-btn .ic { width: 13px; height: 13px; }
.quick-chips { display: flex; gap: 5px; margin-top: 7px; overflow-x: auto; padding-bottom: 1px; scrollbar-width: none; }
.quick-chips::-webkit-scrollbar { display: none; }
.qchip { flex: none; height: 22px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line-2); background: transparent; color: var(--text-3); font-size: 9.5px; white-space: nowrap; }
.qchip:hover { color: var(--text); border-color: var(--line-3); background: var(--surface-2); }

/* 会话消息 */
.chat-sys { display: flex; align-items: flex-start; gap: 6px; font-size: 9.5px; color: var(--text-3); line-height: 1.55; padding: 1px 2px; }
.chat-sys .ic { width: 11px; height: 11px; margin-top: 2px; color: var(--green); flex: none; }
.chat-user { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.chat-user .bubble { max-width: 88%; background: var(--primary-bg); border: 1px solid var(--primary-line); color: var(--text); border-radius: 9px 9px 2px 9px; padding: 8px 10px; font-size: 12px; line-height: 1.55; }
.chat-user .t { font-size: 8.5px; color: var(--text-4); font-family: var(--font-mono); padding-right: 2px; }
.chat-ai { display: flex; gap: 8px; align-items: flex-start; }
.chat-av { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-2); display: grid; place-items: center; flex: none; }
.chat-av .ic { width: 13px; height: 13px; }
.chat-ai-body { min-width: 0; flex: 1; }
.chat-ai .who { display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--text-3); margin-bottom: 4px; }
.chat-ai .who b { font-size: 10px; font-weight: var(--fw-med); color: var(--text-2); }
.chat-ai p { margin: 0; font-size: 11.5px; line-height: 1.7; color: var(--text-2); }
.chat-ai p + p { margin-top: 4px; }
.chat-tool { border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-size: 10px; overflow: hidden; }
.chat-tool summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; color: var(--text-3); }
.chat-tool summary::-webkit-details-marker { display: none; }
.chat-tool summary .ic { width: 11px; height: 11px; color: var(--primary); flex: none; }
.chat-tool .tn { font-family: var(--font-mono); color: var(--text-2); font-size: 9.5px; }
.chat-tool .td { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-tool .dur { margin-left: auto; font-family: var(--font-mono); font-size: 8.5px; color: var(--text-4); flex: none; }
.chat-tool .chev { width: 10px; height: 10px; transition: transform .15s; flex: none; }
.chat-tool[open] .chev { transform: rotate(90deg); }
.chat-tool .tout { border-top: 1px solid var(--line); padding: 6px 8px; font-family: var(--font-mono); font-size: 9px; color: var(--text-3); line-height: 1.6; }
.chat-card { border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); overflow: hidden; }
.chat-card.accent { border-color: var(--primary-line); }
.chat-card.violet { border-color: var(--violet-line); }
.cc-head { display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px 7px; }
.cc-ico { width: 25px; height: 25px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--primary-bg); color: var(--primary); }
.cc-ico.violet { background: var(--violet-bg); color: var(--violet); }
.cc-ico .ic { width: 13px; height: 13px; }
.cc-t { font-size: 11px; font-weight: var(--fw-semi); color: var(--text); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.cc-m { font-size: 9.5px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
.cc-actions { display: flex; gap: 5px; padding: 0 10px 9px 43px; }
.cc-actions button { height: 22px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); font-size: 9.5px; }
.cc-actions button:hover { background: var(--surface-2); color: var(--text); }
.cc-actions button.primary { background: var(--primary-strong); border-color: var(--primary-strong); color: #fff; }
.cc-actions button.primary:hover { background: var(--primary-strong-h); }
.typing { display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--text-3); padding-top: 5px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); animation: tk 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
.typing span { margin-left: 4px; }
@keyframes tk { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }

/* 动态 */
.act-list { display: flex; flex-direction: column; gap: 2px; }
.act-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.act-item:last-child { border-bottom: 0; }
.act-item .avatar { width: 22px; height: 22px; font-size: 8px; flex: none; }
.act-main { min-width: 0; flex: 1; }
.act-text { font-size: 11px; color: var(--text-2); line-height: 1.55; }
.act-text b { color: var(--text); font-weight: var(--fw-med); }
.act-obj { color: var(--text-2); background: var(--surface-2); border-radius: 3px; padding: 0 4px; }
.act-time { font-size: 9px; color: var(--text-4); margin-top: 2px; font-family: var(--font-mono); }
.act-item .go { border: 0; background: transparent; color: var(--text-4); padding: 2px; border-radius: 3px; flex: none; }
.act-item .go:hover { color: var(--text-2); background: var(--surface-2); }
.act-item .go .ic { width: 11px; height: 11px; }
.act-note { margin-top: auto; display: flex; gap: 6px; align-items: flex-start; font-size: 9.5px; color: var(--text-3); line-height: 1.55; padding-top: 10px; }
.act-note .ic { width: 11px; height: 11px; margin-top: 1px; flex: none; }

/* ============================== 状态栏 ============================== */
.c-status {
  height: 30px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px;
  border-top: 1px solid var(--line); background: var(--bg-elev); font-size: 9.5px; color: var(--text-3);
  overflow: hidden; white-space: nowrap;
}
.c-status .sync { display: inline-flex; align-items: center; gap: 5px; color: var(--green); }
.c-status .sync i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.c-status .sp { flex: 1; }
.stlink { display: inline-flex; align-items: center; gap: 4px; height: 22px; border: 1px solid transparent; background: transparent; color: var(--text-3); border-radius: 4px; padding: 0 5px; font-size: 9.5px; }
.stlink:hover { color: var(--text-2); background: var(--surface-2); border-color: var(--line); }
.stlink .ic { width: 11px; height: 11px; }
.stpath { color: var(--text-4); font-size: 9px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.stbadge { flex: none; font-size: 8.5px; color: var(--violet); background: var(--violet-bg); border: 1px solid var(--violet-line); border-radius: 3px; padding: 1px 5px; }

/* ============================== 浮层 / 气泡 ============================== */
.pop {
  position: fixed; z-index: 80; width: 300px; background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow-pop);
  padding: 5px; animation: popin .13s var(--ease);
}
@keyframes popin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.pop--w { width: 336px; }
.pop-hd { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px; font-size: 10px; color: var(--text-3); }
.pop-hd .mono { color: var(--text-2); }
.pop-hd .r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.pop-hd .r button { height: 20px; border: 0; background: transparent; color: var(--primary); font-size: 9.5px; padding: 0 4px; border-radius: 3px; }

  /* ============================ 画板 · 评论钉 ============================ */
  function pinsHTML(screen) {
    const list = PINS[screen.id] || [];
    if (!list.length) return '';
    return list.map((p, i) => {
      const flip = p.x > 55;
      const open = state.openPin === i;
      return `
        <button class="pin${p.resolved ? ' resolved' : ''}" style="left:${p.x}%;top:${p.y}%" data-pin="${i}" title="${esc(p.name)}的评论">${i + 1}</button>
        ${open ? `
        <div class="pin-card${flip ? ' flip' : ''}" style="left:${p.x}%;top:${p.y}%;margin-left:${flip ? 0 : 16}px;margin-top:10px">
          <button class="pclose" data-act="pinclose" title="关闭">×</button>
          <div class="pch"><span class="avatar ${p.av}">${p.name[0]}</span><b>${p.name}</b><span class="t">${p.time}</span></div>
          <div class="ptx">${esc(p.text)}</div>
          <div class="pft"><span>${p.resolved ? '✓ 已解决' : '王五：' + esc(p.reply)}</span><button data-act="composer:回复${p.name}：这版已经按意见调整，麻烦再看一下。">回复</button></div>
        </div>` : ''}`;
    }).join('');
  }

  function artboardHTML(req, screen, mode, opts) {
    opts = opts || {};
    if (mode === 'proto') return screen.plat === 'mini' ? lofiPhone(screen.id) : lofiWeb(screen.id);
    return screen.plat === 'mini' ? phoneScreen(screen.id) : webScreen(screen.id, opts);
  }

  /* ============================ 视图 · 需求文档 ============================ */
  function docHTML(req) {
    const d = req.doc;
    const crit = req.acceptance.map((a) => `
      <div class="crit ${a.state === 'pass' ? 'pass' : ''}">
        <span class="cb">${a.state === 'pass' ? '<svg class="ic"><use href="icons.svg#i-check"></use></svg>' : ''}</span>
        <span>${a.text}</span>
        <span class="st chip ${a.state === 'pass' ? 'chip--done' : a.state === 'warn' ? 'chip--warn' : 'chip--plain'}">${a.state === 'pass' ? '已满足' : a.state === 'warn' ? '待确认' : '待验证'}</span>
      </div>`).join('');
    const changes = d.changes.map((c) => `
      <div class="change"><b>${c.who}</b> · ${c.text}<br><span class="mono" style="font-size:9.5px">${c.when}</span></div>`).join('');
    return `
    <div class="doc-scroll"><div class="doc">
      <div class="doc-eyebrow"><span class="mono">${req.code}</span><span>·</span><span>需求活文档</span><span class="chip chip--plain">设计输入</span><span class="badge">${d.version}</span></div>
      <h1 class="doc-title">${req.name}</h1>
      <div class="doc-meta">
        <span class="avatar sm ${d.ownerAv}">${d.owner[0]}</span><span>${d.owner} 维护</span><i class="dot"></i>
        <span>${d.updated} 更新</span><i class="dot"></i><span>${req.platform}</span><i class="dot"></i><span>验收人 ${d.reviewer}</span>
      </div>
      <div class="doc-layout">
        <div class="doc-main">
          <section class="doc-sec"><h3>背景</h3><p>${d.background}</p></section>
          <section class="doc-sec"><h3>目标</h3><p>${d.goal}</p></section>
          <section class="doc-sec"><h3>页面范围</h3><ul class="doc-list">${d.scope.map((x, i) => `<li><span class="n">0${i + 1}</span><span>${x}</span></li>`).join('')}</ul></section>
          <section class="doc-sec"><h3>状态与边界</h3><ul class="doc-list">${d.states.map((x) => `<li><span class="n">·</span><span>${x}</span></li>`).join('')}</ul></section>
          <section class="doc-sec"><h3>验收标准</h3><div class="crit-list">${crit}</div>
            <div class="doc-quote"><div class="qh"><span class="avatar ${d.quote.av}">${d.quote.who[0]}</span>${d.quote.who} · 评审意见</div>${d.quote.text}</div>
          </section>
          <section class="doc-sec" style="margin-bottom:6px"><h3>变更记录</h3><div class="doc-changes">${changes}</div></section>
        </div>
        <aside class="doc-side">
          <div class="side-card">
            <h4>属性</h4>
            <div class="kv"><span class="k">负责人</span><span class="v"><span class="avatar sm ${d.ownerAv}" style="width:16px;height:16px;font-size:7px">${d.owner[0]}</span>${d.owner}</span></div>
            <div class="kv"><span class="k">设计师</span><span class="v"><span class="avatar sm av-3" style="width:16px;height:16px;font-size:7px">王</span>王五</span></div>
            <div class="kv"><span class="k">验收人</span><span class="v">${d.reviewer}</span></div>
            <div class="kv"><span class="k">端</span><span class="v">${req.platform}</span></div>
            <div class="kv"><span class="k">设计版本</span><span class="v mono">${req.design.latest}${req.design.draft ? ' → ' + req.design.draft : ''}</span></div>
            <div class="kv"><span class="k">状态</span><span class="v"><span class="${chipClass(req.status.kind)}">${req.status.label}</span></span></div>
          </div>
          <div class="side-card">
            <h4>关联产物</h4>
            <button class="side-link" data-act="stage:proto"><svg class="ic"><use href="icons.svg#i-panel"></use></svg>产品原型<span class="r">${req.protoScreens.length} 屏</span></button>
            <button class="side-link" data-act="stage:design"><svg class="ic"><use href="icons.svg#i-edit"></use></svg>设计稿<span class="r mono">${req.design.latest}</span></button>
            <button class="side-link" data-act="stage:review"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg>验收清单<span class="r">${req.acceptance.length} 条</span></button>
          </div>
          <div class="side-card">
            <h4>参与人 · 每人一个会话</h4>
            <div class="avatars"><span class="avatar av-1">张</span><span class="avatar av-2">李</span><span class="avatar av-3">王</span><span class="nm">3 人参与</span></div>
            <div style="font-size:9.5px;color:var(--text-3);line-height:1.55;margin-top:7px">会话私有，需求状态、产物和评论共享。</div>
          </div>
        </aside>
      </div>
    </div></div>`;
  }

  /* ============================ 视图 · 开发交接 ============================ */
  function fileData(req) {
    const pages = req.screens.map((s) => ({ n: s.plat === 'mini' ? 'pages/' + s.id + '.html' : 'pages/' + s.id + '.html', size: s.plat === 'mini' ? '8.6 KB' : '12.4 KB', icon: 'i-file' }));
    const support = [
      { n: 'assets/tokens.css', size: '6.2 KB', icon: 'i-code' },
      { n: 'assets/app.css', size: '58.3 KB', icon: 'i-code' }
    ];
    if (req.code === 'S13-001') {
      support.push({ n: 'screenshots/empty-state@2x.png', size: '188 KB', icon: 'i-eye' });
      support.push({ n: 'README.md', size: '2.1 KB', icon: 'i-file' });
      support.push({ n: 'manifest.json', size: '0.8 KB', icon: 'i-code' });
    } else {
      support.push({ n: 'README.md', size: '1.8 KB', icon: 'i-file' });
      support.push({ n: 'manifest.json', size: '0.7 KB', icon: 'i-code' });
    }
    return { pages, support };
  }

  function devHTML(req) {
    const canDev = req.status.label === '已通过';
    const ready = req.design.delivered;
    let banner = '';
    if (canDev) {
      banner = `<div class="rev-banner good"><span class="ico"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg></span><div><span class="b">设计与验收已就绪</span><div>交接包会带进赵六的开发会话，包括设计稿、验收标准和变更记录。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:review">查看验收记录</button></div></div>`;
    } else if (ready) {
      banner = `<div class="rev-banner warn"><span class="ico"><svg class="ic"><use href="icons.svg#i-clock"></use></svg></span><div><span class="b">等待验收通过</span><div>设计已交付，验收通过后自动解锁开发交接；也可以先看交接包。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:review">去验收</button></div></div>`;
    } else {
      banner = `<div class="rev-banner"><span class="ico"><svg class="ic"><use href="icons.svg#i-lock"></use></svg></span><div><span class="b">设计 ${req.design.draft || ''} 尚未交付</span><div>开发交接会锁定到最后一版已交付设计。交付后再进入这里。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:design">去设计画布</button></div></div>`;
    }
    const files = fileData(req);
    const flow = [
      { icon: 'i-branch', t: '开发分支', s: 'feat/s13-' + req.code.slice(-3) + '-points', state: canDev ? '可创建' : '未创建', chip: canDev ? 'chip--prog' : 'chip--na' },
      { icon: 'i-upload', t: 'Merge Request', s: '等待会话创建后生成', state: '—', chip: 'chip--na' },
      { icon: 'i-shield', t: 'CI / 预览环境', s: '沿用 dsh-workbench 流水线', state: '—', chip: 'chip--na' }
    ];
    return `
    <div class="dev-scroll"><div class="dev">
      <div class="page-hd"><div class="t"><h2>开发交接</h2><p>${req.name} · ${req.code} · 设计、验收标准与文件包一起带进开发会话</p></div>
        <div class="r"><span class="${chipClass(req.status.kind)}">${req.status.label}</span></div>
      </div>
      ${banner}
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-package"></use></svg><span class="t">交接包</span><span class="r mono">${req.design.latest} · ${req.filesN} 个文件</span></div>
        <div class="handoff-stats">
          <div class="hs"><div class="lab">设计版本</div><div class="v">${req.design.latest}</div><div class="d">${req.design.delivered ? '已交付' : '有草稿未交付'}</div></div>
          <div class="hs"><div class="lab">页面</div><div class="v">${req.screens.length}</div><div class="d">${req.platform}</div></div>
          <div class="hs"><div class="lab">验收标准</div><div class="v">${req.acceptance.length}</div><div class="d">${req.acceptance.filter((a) => a.state === 'pass').length} 条已满足</div></div>
          <div class="hs"><div class="lab">交付文件</div><div class="v">${req.filesN}</div><div class="d">含 CSS 与清单</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-folder"></use></svg><span class="t">包内容</span><span class="r">来自服务端交付版本</span></div>
        <div class="panel-bd" style="padding:4px 13px">
          ${files.pages.concat(files.support).map((f) => `<div class="file-row"><svg class="ic"><use href="icons.svg#${f.icon}"></use></svg><span class="fn">${f.n}</span><span class="fs">${f.size}</span><button data-act="files">查看</button></div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-branch"></use></svg><span class="t">开发流水线</span><span class="r">由 DSH 会话执行</span></div>
        ${flow.map((f) => `<div class="flow-row"><span class="flow-ico"><svg class="ic"><use href="icons.svg#${f.icon}"></use></svg></span><div class="flow-main"><div class="flow-t">${f.t}</div><div class="flow-s">${f.s}</div></div><div class="flow-r"><span class="chip ${f.chip}">${f.state}</span></div></div>`).join('')}
      </div>
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-users"></use></svg><span class="t">这个需求的会话</span><span class="r">每人一个 · 内容互不可见</span></div>
        ${[
          { name: '李四', av: 'av-2', s: '产品会话', d: '需求创建者 · 2 小时前活跃' },
          { name: '王五', av: 'av-3', s: '设计会话', d: '设计交付人 · 刚刚活跃' },
          { name: '张三', av: 'av-1', s: '负责人会话', d: '评审人 · 1 小时前活跃' },
          { name: '赵六', av: 'av-4', s: '开发会话', d: '未开始 · 验收通过后可创建', idle: true }
        ].map((p) => `<div class="flow-row"><span class="avatar ${p.av}" style="width:24px;height:24px;font-size:9px;${p.idle ? 'opacity:.45' : ''}">${p.name[0]}</span><div class="flow-main"><div class="flow-t">${p.name} · ${p.s}</div><div class="flow-s">${p.d}</div></div><div class="flow-r"><span class="chip ${p.idle ? 'chip--na' : 'chip--plain'}">${p.idle ? '未创建' : '私有'}</span></div></div>`).join('')}
      </div>
      <div class="dev-actions">
        <button class="btn btn-primary" data-act="devstart" ${canDev ? '' : 'disabled'}>创建开发会话</button>
        <button class="btn btn-ghost" data-act="toast:交接包会以 zip 下载（示例）"><svg class="ic"><use href="icons.svg#i-download"></use></svg>下载交接包</button>
      </div>
      <div class="dev-note">开发会话由赵六本人创建，会继承本需求的验收标准与设计版本；画布上的设计不会被复制成新文件。</div>
    </div></div>`;
  }

  /* ============================ 视图 · 验收 ============================ */
  function reviewHTML(req) {
    const delivered = req.design.delivered;
    const approved = req.status.label === '已通过';
    const canAct = canApprove() && state.role !== 'wangwu';
    const passed = req.acceptance.filter((a) => a.state === 'pass').length;
    let banner = '';
    if (approved) {
      banner = `<div class="rev-banner good"><span class="ico"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg></span><div><span class="b">${req.code} 已通过验收</span><div>${passed}/${req.acceptance.length} 条标准满足，开发会话入口已解锁。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:dev">去开发交接</button></div></div>`;
    } else if (!delivered) {
      banner = `<div class="rev-banner warn"><span class="ico"><svg class="ic"><use href="icons.svg#i-clock"></use></svg></span><div><span class="b">设计 ${req.design.draft || ''} 尚未交付</span><div>验收会在设计交付后解锁；可以先看已交付的 ${req.design.latest} 和验收标准。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:design">去设计画布</button></div></div>`;
    } else {
      banner = `<div class="rev-banner"><span class="ico"><svg class="ic"><use href="icons.svg#i-eye"></use></svg></span><div><span class="b">设计 ${req.design.latest} 已交付，等待验收</span><div>${passed}/${req.acceptance.length} 条标准已满足；勾选后可整单通过或退回。</div></div><div class="r"><button class="btn btn-sm btn-ghost" data-act="stage:design">预览设计</button></div></div>`;
    }
    const rows = req.acceptance.map((a, i) => {
      const icon = a.state === 'pass' ? '<svg class="ic"><use href="icons.svg#i-check"></use></svg>' : a.state === 'warn' ? '<svg class="ic"><use href="icons.svg#i-clock"></use></svg>' : '';
      return `<div class="rev-item ${a.state}">
        <span class="box">${icon}</span>
        <div class="rm"><div class="rt">${a.text}</div><div class="rs">${a.note}</div></div>
        <div class="rr">${canAct
          ? `<button class="tbtn${a.state === 'pass' ? ' on' : ''}" data-act="itempass:${i}">通过</button><button class="tbtn${a.state === 'warn' ? ' on' : ''}" data-act="itemwarn:${i}">有问题</button>`
          : `<span class="chip ${a.state === 'pass' ? 'chip--done' : a.state === 'warn' ? 'chip--warn' : 'chip--plain'}">${a.state === 'pass' ? '已满足' : a.state === 'warn' ? '待确认' : '待验证'}</span>`}</div>
      </div>`;
    }).join('');
    const thumbs = req.screens.map((s, i) => `
      <button class="rev-th" data-act="stage:design|screen:${i}">
        <div class="rimg${s.plat === 'mini' ? ' mini' : ''}"><i></i><i></i><i></i><i></i></div>
        <div class="rtn"><span class="mono">0${i + 1}</span>${s.name}</div>
      </button>`).join('');
    const foot = approved
      ? `<div class="rev-foot"><span class="chip chip--done">已通过</span><span class="rev-note">验收记录已同步给所有参与人；设计版本冻结为 ${req.design.latest}。</span></div>`
      : `<div class="rev-foot">
          <button class="btn btn-primary" data-act="approve" ${canAct ? '' : 'disabled'}>通过并通知参与人</button>
          <button class="btn btn-ghost" data-act="reject" ${canAct ? '' : 'disabled'}>退回修改</button>
          <span class="grow"></span>
          <span class="rev-note">${state.role === 'wangwu' ? '设计参与人不能验收 · 可切换到李四体验' : !delivered ? '设计交付后解锁' : '验收人：李四、张三'}</span>
        </div>`;
    return `
    <div class="rev-scroll"><div class="rev">
      <div class="page-hd"><div class="t"><h2>设计验收</h2><p>${req.name} · ${req.code} · ${req.acceptance.length} 条标准 · 验收人 李四</p></div>
        <div class="r"><span class="${chipClass(req.status.kind)}">${req.status.label}</span></div>
      </div>
      ${banner}
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg><span class="t">验收清单</span><span class="r">${passed}/${req.acceptance.length} 条满足</span></div>
        <div class="rev-list">${rows}</div>
      </div>
      <div class="panel">
        <div class="panel-hd"><svg class="ic"><use href="icons.svg#i-panel"></use></svg><span class="t">设计版本 ${req.design.latest}</span><span class="r">点击缩略图回到画布</span></div>
        <div class="rev-thumbs">${thumbs}</div>
      </div>
      ${foot}
    </div></div>`;
  }

  /* ============================ 视图 · 设计 / 原型 ============================ */
  function stageBanner(req, mode, screen) {
    if (mode === 'proto') {
      return `<div class="stage-banner good ab-wide" data-abwide><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg><span>原型由李四确认 · 作为设计的输入</span><span class="grow"></span><button data-act="toast:原型确认记录：李四 · 11-20 17:05">确认记录</button></div>`;
    }
    if (req.status.label === '已通过') {
      return `<div class="stage-banner good ab-wide" data-abwide><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg><span>验收已通过 · 设计冻结在 ${req.design.latest}</span><span class="grow"></span><button data-act="stage:dev">去开发交接</button></div>`;
    }
    if (!req.design.delivered) {
      return `<div class="stage-banner warn ab-wide" data-abwide><svg class="ic"><use href="icons.svg#i-alert"></use></svg><span><b style="font-weight:600">${req.design.draft} 草稿未交付</b> · 空态已按李四意见重做，交付后进入验收</span><span class="grow"></span><button data-act="deliver">交付 ${req.design.draft}</button></div>`;
    }
    return `<div class="stage-banner good ab-wide" data-abwide><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg><span>${req.design.latest} 已交付 · 等待李四验收</span><span class="grow"></span><button data-act="stage:review">去验收</button></div>`;
  }

  function screenItem(req, s, i, mode) {
    const active = i === state.screen;
    const thumb = s.plat === 'mini'
      ? `<span class="dv-thumb phone"><span class="tb dark" style="width:10px"></span><span class="tb-dot"></span><span class="tb hero"></span><span class="tb line"></span><span class="tb line" style="width:70%"></span></span>`
      : s.id === 'filter'
        ? `<span class="dv-thumb web filter"><span class="tb dark" style="width:12px"></span><span class="tb hero"></span><span class="tb line"></span><span class="tb line"></span><span class="tb row"></span><span class="tb row"></span><span class="tb-drawer"></span></span>`
        : s.id === 'empty'
          ? `<span class="dv-thumb web empty"><span class="tb dark" style="width:12px"></span><span class="tb gap"></span><span class="tb-dot"></span><span class="tb line" style="width:60%;margin:0 auto"></span><span class="tb line" style="width:40%;margin:0 auto"></span></span>`
          : `<span class="dv-thumb web"><span class="tb dark" style="width:12px"></span><span class="tb hero"></span><span class="tb line"></span><span class="tb row"></span><span class="tb row"></span><span class="tb row"></span></span>`;
    return `<button class="dv-item${active ? ' active' : ''}" data-screen="${i}">${thumb}
      <span class="dv-itxt"><span class="dv-iname">${s.name}${s.tag ? `<i class="tag-new">${s.tag}</i>` : ''}</span><span class="dv-imeta">${mode === 'proto' ? s.meta : s.meta}</span></span>
    </button>`;
  }

  function designView(req, mode) {
    const screens = mode === 'proto' ? req.protoScreens : req.screens;
    const idx = Math.min(state.screen, screens.length - 1);
    const screen = screens[idx];
    const base = screen.plat === 'mini' ? 375 : 720;
    const abW = Math.round(base * state.zoom);
    const lofi = mode === 'proto';

    if (state.view === 'overview') {
      return `<div class="ov">
        <div class="ov-hd"><svg class="ic"><use href="icons.svg#i-panel"></use></svg><span>${screens.length} 屏 · ${lofi ? '低保真' : req.design.latest} · 点击画板进入单屏</span><span class="grow"></span><span class="mono">S13 · ${req.code}</span></div>
        <div class="ov-grid">
          ${screens.map((s, i) => `<div class="ov-card${i === idx ? ' active' : ''}" role="button" tabindex="0" data-act="screen:${i}">
            <div class="ov-cap"><span class="num">0${i + 1}</span><span>${s.name}</span>${s.tag ? `<span class="tag-new">${s.tag}</span>` : ''}<span class="chip chip--plain">${s.plat === 'mini' ? '375' : '1440'}</span></div>
            <div class="ab-zoom" style="zoom:${s.plat === 'mini' ? 0.78 : 0.42}"><div class="ab ${s.plat === 'mini' ? 'phone' : ''} ${lofi ? 'lofi' : ''}">${artboardHTML(req, s, mode)}</div></div>
          </div>`).join('')}
        </div>
      </div>`;
    }

    if (state.compare && mode === 'design') {
      const compareV0 = artboardHTML(req, screen, mode, { v0: true });
      return `<div class="cmp">
        <div class="cmp-note"><svg class="ic"><use href="icons.svg#i-history"></use></svg><span><b>d0 → ${req.design.draft || req.design.latest}</b> · 新增余额概览、过期置灰与类型筛选；空态在 d2 里重做</span></div>
        <div class="cmp-row">
          <div class="cmp-pane"><div class="cmp-hd"><b>d0 · 初版</b><span class="chip chip--plain">11-23 17:40</span><span>未交付</span></div>
            <div class="ab-zoom" style="zoom:.6"><div class="ab">${compareV0}</div></div></div>
          <div class="cmp-pane"><div class="cmp-hd"><b>${req.design.draft || req.design.latest} · ${req.design.draft ? '草稿' : '已交付'}</b><span class="chip ${req.design.draft ? 'chip--warn' : 'chip--done'}">${req.design.draft ? '未交付' : '当前版本'}</span><span>${screen.name}</span></div>
            <div class="ab-zoom" style="zoom:.6"><div class="ab">${artboardHTML(req, screen, mode)}</div></div></div>
        </div>
      </div>`;
    }

    const pins = (mode === 'design' && state.annotate) ? pinsHTML(screen) : '';
    const labelChip = lofi ? '已确认' : (screen.tag ? '草稿' : '已交付');
    return `
    <div class="dv">
      <div class="dv-rail">
        <div class="dv-rail-hd"><span>${screens.length} 屏 · ${lofi ? '低保真' : req.design.latest}</span><span class="mono">${req.code}</span></div>
        ${screens.map((s, i) => screenItem(req, s, i, mode)).join('')}
        <div class="dv-rail-note"><svg class="ic"><use href="icons.svg#i-lock"></use></svg><span>${lofi ? '原型随需求保存；设计稿由服务端版本管理' : '版本来自团队服务端，与会话共享同一份'}</span></div>
      </div>
      <div class="stage-scroll" id="stageScroll">
        <div class="stage-inner">
          ${stageBanner(req, mode, screen)}
          <div class="ab-label ab-wide" data-abwide style="width:${abW}px">
            <span class="nm">${screen.name}</span>
            <span class="dim">${screen.plat === 'mini' ? '375 × 812' : '1440 × 960'} · ${lofi ? '低保真' : '高保真'}</span>
            <span class="chip ${lofi ? 'chip--plain' : screen.tag ? 'chip--warn' : 'chip--done'}">${labelChip}</span>
            <span class="r"><span class="who">${lofi ? '<span class="avatar av-2">李</span>李四 · 11-20' : `<span class="avatar av-3">王</span>${screen.meta}`}</span></span>
          </div>
          <div class="ab-zoom" id="abZoom" style="zoom:${state.zoom}">
            <div class="ab ${screen.plat === 'mini' ? 'phone' : ''} ${lofi ? 'lofi' : ''}">${artboardHTML(req, screen, mode)}${pins}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ============================ 画布头部 / 工具条 ============================ */
  function permHTML(req) {
    if (state.stage === 'doc') {
      return isEditable()
        ? `<span class="perm ok"><svg class="ic"><use href="icons.svg#i-edit"></use></svg>可编辑 · 保存后版本 +1</span>`
        : `<span class="perm"><svg class="ic"><use href="icons.svg#i-lock"></use></svg>只读 · 可评论</span>`;
    }
    if (state.stage === 'proto') {
      return isEditable()
        ? `<span class="perm ok"><svg class="ic"><use href="icons.svg#i-check"></use></svg>你是产品 · 可确认原型</span>`
        : `<span class="perm"><svg class="ic"><use href="icons.svg#i-lock"></use></svg>只读 · 李四确认</span>`;
    }
    if (state.stage === 'design') {
      return isEditable()
        ? `<span class="perm ok"><svg class="ic"><use href="icons.svg#i-edit"></use></svg>可编辑 · 改动写回 design/</span>`
        : `<span class="perm"><svg class="ic"><use href="icons.svg#i-lock"></use></svg>只读预览 · 设计由王五维护</span>`;
    }
    if (state.stage === 'review') {
      return isEditable() || state.role === 'zhangsan'
        ? `<span class="perm ok"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg>可验收 · 通过后解锁开发</span>`
        : `<span class="perm"><svg class="ic"><use href="icons.svg#i-lock"></use></svg>只读 · 验收由李四执行</span>`;
    }
    return `<span class="perm"><svg class="ic"><use href="icons.svg#i-package"></use></svg>交接包来自 ${req.design.latest}</span>`;
  }

    if (state.stage === 'doc') {

        ${req.code === 'S13-001' ? `<span class="tsep"></span><button class="tbtn ${state.compare ? 'on' : ''}" data-act="compare"><svg class="ic"><use href="icons.svg#i-history"></use></svg>对比 d0</button>` : ''}
        <button class="tbtn ${state.annotate ? 'on' : ''}" data-act="annotate" title="显示 / 隐藏画板评论"><svg class="ic"><use href="icons.svg#i-message"></use></svg>标注</button>

      return `<button class="tbtn" data-act="toast:分支名已复制（示例）"><svg class="ic"><use href="icons.svg#i-branch"></use></svg>复制分支名</button>
        <button class="tbtn" data-act="files"><svg class="ic"><use href="icons.svg#i-package"></use></svg>交接包</button>`;
    }
    return `<button class="tbtn" data-act="stage:doc"><svg class="ic"><use href="icons.svg#i-file"></use></svg>需求文档</button>
      <button class="tbtn" data-act="toast:验收单已导出（示例）"><svg class="ic"><use href="icons.svg#i-download"></use></svg>导出验收单</button>`;
  }

  function canvasMeta(req) {
    if (state.stage === 'doc') return `${req.doc.version} · ${req.doc.owner} · ${req.doc.updated} 更新`;
    if (state.stage === 'proto') return `${req.protoScreens.length} 屏 · 已由李四确认 · 低保真`;
    if (state.stage === 'design') return `${req.screens.length} 屏 · ${req.design.draft ? req.design.latest + ' 已交付 · ' + req.design.draft + ' 草稿' : req.design.latest + ' 已交付'}`;
    if (state.stage === 'dev') return `设计 ${req.design.latest} · ${req.design.delivered ? '已交付' : '未交付'} · ${req.status.label}`;
    return `${req.acceptance.length} 条标准 · 验收人 李四`;
  }

  const STAGE_TITLE = { doc: '需求文档', proto: '产品原型', design: '设计稿', dev: '开发交接', review: '设计验收' };

  function aiMsg(text) { return { t: 'ai', text: text }; }
  function toolMsg(name, desc, dur, out) { return { t: 'tool', name: name, desc: desc, dur: dur, out: out }; }
  function actionCard(o) { o.t = 'card'; o.kind = o.kind || 'action'; return o; }
