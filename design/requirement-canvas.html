      { label: '我的待办', act: 'pop:todo' },
      { label: '打开设计', act: 'stage:design' }
    ]
  };

  const TODOS = {
    wangwu: [
      { icon: 'i-upload', t: '交付 S13-001 设计 d2', s: '空态已重做 · 3 屏已齐 · 未交付', act: 'req:S13-001|stage:design|deliver' },
      { icon: 'i-message', t: '查看 S13-002 的验收意见', s: '李四 · 替代商品需要标积分价格', act: 'req:S13-002|stage:review' },
      { icon: 'i-calendar', t: '迭代排期评审', s: '明天 10:00 · 2 个需求', act: 'toast:演示稿：已加入日程（明天 10:00）' }
    ],
    lisi: [
      { icon: 'i-check-circle', t: '验收 S13-002 设计 d1', s: '2 屏 · 4 条标准 · 2 条待确认', act: 'req:S13-002|stage:review' },
      { icon: 'i-file', t: '补充 S13-001 验收标准', s: '需求 v3 · 已同步给王五', act: 'req:S13-001|stage:doc' },
      { icon: 'i-calendar', t: '迭代排期评审', s: '明天 10:00 · 2 个需求', act: 'toast:演示稿：已加入日程（明天 10:00）' }
    ],
    zhangsan: [
      { icon: 'i-eye', t: '跟进 S13-001 设计 d2', s: '王五 · 空态改稿中 · 未交付', act: 'req:S13-001|stage:design' },
      { icon: 'i-check-circle', t: '验收 S13-002 设计 d1', s: '李四主验收 · 你可参与', act: 'req:S13-002|stage:review' },
      { icon: 'i-calendar', t: '迭代排期评审', s: '明天 10:00 · 2 个需求', act: 'toast:演示稿：已加入日程（明天 10:00）' }
    ]
  };

  /* ============================ 渲染 · 顶栏 / 阶段 ============================ */
  function getNext() {
    const req = reqOf();
    if (req.status.label === '已通过') return { label: '查看开发交接', icon: 'i-terminal', act: 'stage:dev' };
    if (req.status.label === '有修改') return { label: '查看改稿进度', icon: 'i-eye', act: 'stage:design' };
    if (req.code === 'S13-001') {
      if (!req.design.delivered) {
        if (state.role === 'wangwu') return { label: '交付设计 d2', icon: 'i-upload', act: 'deliver' };
        if (state.role === 'lisi') return { label: '给王五留言', icon: 'i-message', act: 'focusComposer' };
        return { label: '查看设计进度', icon: 'i-eye', act: 'stage:design' };
      }
      if (state.role === 'wangwu') return { label: '查看验收进度', icon: 'i-eye', act: 'stage:review' };
      if (state.role === 'lisi') return { label: '验收设计 d2', icon: 'i-check-circle', act: 'stage:review' };
      return { label: '查看验收', icon: 'i-eye', act: 'stage:review' };
    }
    if (state.role === 'wangwu') return { label: '查看验收意见', icon: 'i-message', act: 'stage:review' };
    if (state.role === 'lisi') return { label: '验收设计 d1', icon: 'i-check-circle', act: 'stage:review' };
    return { label: '查看验收进度', icon: 'i-eye', act: 'stage:review' };
  }

  function hintText() {
    const req = reqOf();
    if (req.status.label === '已通过') return '已通过验收 · 可创建开发会话';
    if (req.status.label === '有修改') return '已退回修改 · 等待王五改稿';
    if (req.code === 'S13-001') {
      if (req.design.delivered) return '等待李四验收设计 d2';
      if (state.role === 'wangwu') return '交付 d2 · 空态改稿已完成';
      return '王五正在修改空态 · d2 未交付';
    }
    return '等待李四验收设计 d1';
  }

  function renderTop() {
    const req = reqOf();
    const role = roleOf();
    $('#topReqCode').textContent = req.code;
    $('#topReqName').textContent = req.name;
    const chip = $('#topReqChip');
    chip.className = chipClass(req.status.kind);
    chip.innerHTML = `<span class="d"></span>${req.status.label}`;
    $('#topAvatar').className = 'avatar ' + role.av;
    $('#topAvatar').textContent = role.ini;
    $('#topName').textContent = role.name;
    $('#topRole').textContent = role.role + ' · ' + role.session;
    $('#gbarAvatar').className = 'avatar ' + role.av;
    $('#gbarAvatar').textContent = role.ini;
    $('#todoCount').textContent = '3';
    $('#bellDot').style.display = state.notifRead ? 'none' : '';
    const next = getNext();
    $('#nextBtn').innerHTML = `<svg class="ic"><use href="icons.svg#${next.icon}"></use></svg><span>${next.label}</span>`;
  }

  function renderStages() {
    const req = reqOf();
    const stages = STAGES.map((s, i) => {
      const info = req.stageInfo[s.id];
      const active = state.stage === s.id;
      const dot = info.state === 'idle' ? '' : '<i class="stdot"></i>';
      return `<button class="c-stage ${active ? 'active' : ''} ${info.state}" data-stage="${s.id}">
        <span class="c-stage-ico"><svg class="ic"><use href="icons.svg#${s.icon}"></use></svg>${dot}</span>
        <span class="c-stage-txt"><span class="c-stage-name">${s.name}</span><span class="c-stage-sub">${info.sub}</span></span>
      </button>${i < STAGES.length - 1 ? '<span class="c-stage-sep">›</span>' : ''}`;
    }).join('');
    $('#stages').innerHTML = stages + `<button class="stage-hint" data-act="next"><span class="hint-ico"><svg class="ic"><use href="icons.svg#i-target"></use></svg></span><span class="hint-txt"><b>建议下一步</b><span>${hintText()}</span></span></button>`;
  }

  function renderStatus() {
    const req = reqOf();
    $('#stCode').textContent = req.code + ' · ' + req.doc.version;
    $('#stVer').textContent = req.design.draft ? req.design.latest + ' → ' + req.design.draft : req.design.latest;
    $('#stFilesN').textContent = String(req.filesN);
    $('#stPathText').textContent = req.path;
  }

  /* ============================ 渲染 · 画布 ============================ */
  function renderCanvas() {
    const req = reqOf();
    $('#cTitle').textContent = STAGE_TITLE[state.stage];
    $('#cMeta').textContent = canvasMeta(req);
    $('#cPerm').innerHTML = permHTML(req);
    $('#cTools').innerHTML = toolsHTML(req);
    if (state.stage === 'doc') $('#cBody').innerHTML = docHTML(req);
    else if (state.stage === 'proto') $('#cBody').innerHTML = designView(req, 'proto');
    else if (state.stage === 'design') $('#cBody').innerHTML = designView(req, 'design');
    else if (state.stage === 'dev') $('#cBody').innerHTML = devHTML(req);
    else $('#cBody').innerHTML = reviewHTML(req);
    updateCtxChips();
    requestAnimationFrame(afterCanvas);
  }

  function afterCanvas() {
    if ((state.stage === 'design' || state.stage === 'proto') && state.view === 'canvas' && !state.compare) {
      if (state.zoomAuto) fitZoom();
      else applyZoomLabels();
    }
  }

  function fitZoom() {
    const sc = $('#stageScroll');
    if (!sc) return;
    const screen = currentScreen();
    const base = screen.plat === 'mini' ? 375 : 720;
    const avail = sc.clientWidth - 52;
    state.zoom = Math.max(0.32, Math.min(1, Math.round((avail / base) * 100) / 100));
    applyZoomLabels();
    const z = $('#abZoom');
    if (z) z.style.zoom = state.zoom;
  }

  function applyZoomLabels() {
    const screen = currentScreen();
    const base = screen.plat === 'mini' ? 375 : 720;
    const w = Math.round(base * state.zoom);
    $$('[data-abwide]').forEach((el) => { el.style.width = w + 'px'; });
    const zl = $('#zoomLabel');
    if (zl) zl.textContent = Math.round(state.zoom * 100) + '%';
  }

  function updateCtxChips() {
    const req = reqOf();
    if (!$('#ctxReq')) return;
    $('#ctxReq').textContent = req.code;
    let label = '需求全貌';
    if (state.stage === 'design' || state.stage === 'proto') {
      label = '当前屏 · ' + currentScreen().name;
    } else if (state.stage === 'doc') label = '活文档 · ' + req.doc.version;
    else if (state.stage === 'review') label = '验收 · ' + req.acceptance.length + ' 条';
    else if (state.stage === 'dev') label = '开发交接包';
    $('#ctxScreen').textContent = label;
  }

  /* ============================ 渲染 · 会话 ============================ */
  function chatHTML(chat, req) {
    return chat.map((m) => {
      if (m.t === 'sys') {
        return `<div class="chat-sys"><svg class="ic"><use href="icons.svg#${m.icon || 'i-check-circle'}"></use></svg><span>${esc(m.text)}</span></div>`;
      }
      if (m.t === 'user') {
        return `<div class="chat-user"><div class="bubble">${esc(m.text)}</div><div class="t">${m.time}</div></div>`;
      }
      if (m.t === 'ai') {
        return `<div class="chat-ai"><span class="chat-av"><svg class="ic"><use href="icons.svg#i-logo"></use></svg></span><div class="chat-ai-body"><div class="who"><b>工作台助手</b><span>· 读需求上下文</span></div><p>${esc(m.text)}</p></div></div>`;
      }
      if (m.t === 'tool') {
        return `<details class="chat-tool"><summary><svg class="ic"><use href="icons.svg#i-terminal"></use></svg><span class="tn">${m.name}</span><span class="td">${esc(m.desc)}</span><span class="dur">${m.dur}</span><svg class="ic chev"><use href="icons.svg#i-chev-right"></use></svg></summary><div class="tout">${esc(m.out)}</div></details>`;
      }
      if (m.t === 'card') return cardHTML(m, req);
      return '';
    }).join('');
  }

  function cardHTML(m, req) {
    const delivered = req.design.delivered;
    if (m.kind === 'deliver') {
      return `<div class="chat-card">
        <div class="cc-head"><span class="cc-ico"><svg class="ic"><use href="icons.svg#i-package"></use></svg></span>
          <div><div class="cc-t">${m.title}<span class="chip chip--done">已交付</span></div><div class="cc-m">${m.meta}</div></div></div>
        <div class="cc-actions">${(m.actions || []).map((a) => `<button data-act="${a.act}">${a.label}</button>`).join('')}</div>
      </div>`;
    }
    if (m.draft && delivered) {
      return `<div class="chat-card accent">
        <div class="cc-head"><span class="cc-ico"><svg class="ic"><use href="icons.svg#i-check-circle"></use></svg></span>
          <div><div class="cc-t">设计 d2 已交付<span class="chip chip--done">已交付</span></div><div class="cc-m">8 个文件 · 3 屏 · 刚刚 · 已通知李四验收</div></div></div>
        <div class="cc-actions"><button data-act="stage:design">预览设计</button><button data-act="versions">版本记录</button></div>
      </div>`;
    }
    const actions = (m.actions || []).map((a) => `<button data-act="${a.act}" class="${a.primary ? 'primary' : ''}">${a.label}</button>`).join('');
    return `<div class="chat-card${m.tone === 'violet' ? ' violet' : ''}">
      <div class="cc-head"><span class="cc-ico ${m.tone === 'violet' ? 'violet' : ''}"><svg class="ic"><use href="icons.svg#${m.icon || 'i-target'}"></use></svg></span>
        <div><div class="cc-t">${m.title}</div><div class="cc-m">${m.meta}</div></div></div>
      ${actions ? `<div class="cc-actions">${actions}</div>` : ''}
    </div>`;
  }

  function activityHTML(req) {
    return `<div class="act-list">
      ${req.activity.map((a) => `<div class="act-item">
        <span class="avatar ${a.av}">${a.who[0]}</span>
        <div class="act-main"><div class="act-text"><b>${a.who}</b> ${a.text}</div><div class="act-time">${a.time}</div></div>
        ${a.act ? `<button class="go" data-act="${a.act}" title="定位"><svg class="ic"><use href="icons.svg#i-arrow-right"></use></svg></button>` : ''}
      </div>`).join('')}
    </div>
    <div class="act-note"><svg class="ic"><use href="icons.svg#i-users"></use></svg><span>动态对参与本需求的人可见；会话只属于你自己。</span></div>`;
  }

  function renderDock() {
    const req = reqOf();
    const role = roleOf();
    $('#dockAvatar').className = 'avatar ' + role.av;
    $('#dockAvatar').textContent = role.ini;
    $('#dockName').textContent = role.name;
    $('#dockSessionBadge').textContent = role.session;
    $('#dockSess').textContent = '已连接需求 ' + req.code + ' · 仅你可见';
    $('#actCount').textContent = String(req.activity.length);
    $$('.dock-tab').forEach((t) => t.classList.toggle('active', t.dataset.docktab === state.dockTab));
    $('#compose').style.display = state.dockTab === 'chat' ? '' : 'none';
    const body = $('#chatBody');
    if (state.dockTab === 'chat') {
      body.innerHTML = chatHTML(getChat(), req);
      body.scrollTop = body.scrollHeight;
    } else {
      body.innerHTML = activityHTML(req);
      body.scrollTop = 0;
    }
    body.classList.toggle('scrolled', body.scrollTop > 2);
    const chips = (QUICK[state.role + '|' + state.req] || []).map((c) => {
      if (c.act === 'deliver' && req.status.label === '已通过') return { label: '开发交接', act: 'stage:dev' };
      if (c.act === 'deliver' && req.design.delivered) return { label: '查看验收', act: 'stage:review' };
      return c;
    });
    $('#quickChips').innerHTML = chips.map((c) => `<button class="qchip" data-act="${c.act}">${c.label}</button>`).join('');
    $('#work').classList.toggle('dock-collapsed', state.dockCollapsed);
    updateCtxChips();
  }

  function render() {
    renderTop();
    renderStages();
    renderCanvas();
    renderDock();
    renderStatus();
  }

  /* ============================ 操作 ============================ */
  function setStage(stage) {
    if (!STAGES.some((s) => s.id === stage)) return;
    state.stage = stage;
    state.view = 'canvas';
    state.compare = false;
    state.openPin = null;
    state.zoomAuto = true;
    closePop();
    render();
  }

  function setReq(code) {
    if (!REQS[code]) return;
    state.req = code;
    state.stage = REQS[code].defaultStage;
    state.screen = 0;
    state.view = 'canvas';
    state.compare = false;
    state.openPin = null;
    state.zoomAuto = true;
    state.dockTab = 'chat';
    closePop();
    render();
  }

  function setRole(role) {
    if (!ROLES[role]) return;
    state.role = role;
    closePop();
    render();
    toast('已切换到' + ROLES[role].name + '的视角 · 右侧是' + ROLES[role].session);
  }

  function selectScreen(i) {
    state.screen = i;
    state.view = 'canvas';
    state.compare = false;
    state.openPin = null;
    state.zoomAuto = true;
    renderCanvas();
    closePop();
  }

  function togglePin(i) {
    state.openPin = state.openPin === i ? null : i;
    renderCanvas();
  }

  function adjustZoom(delta) {
    state.zoomAuto = false;
    state.zoom = Math.max(0.35, Math.min(1.2, Math.round((state.zoom + delta) * 100) / 100));
    applyZoomLabels();
    const z = $('#abZoom');
    if (z) z.style.zoom = state.zoom;
  }

  function send() {
    if (state.sending) return;
    const ta = $('#composerInput');
    const text = ta.value.trim();
    if (!text) return;
    if (state.dockTab !== 'chat') { state.dockTab = 'chat'; }
    const chat = getChat();
    chat.push(userMsg(text));
    ta.value = '';
    state.sending = true;
    $('#sendBtn').disabled = true;
    chat.push({ t: 'typing' });
    renderDock();
    setTimeout(() => {
      const i = chat.findIndex((m) => m.t === 'typing');
      if (i >= 0) chat.splice(i, 1);
      replyFor(text).forEach((m) => chat.push(m));
      state.sending = false;
      $('#sendBtn').disabled = false;
      renderDock();
    }, 1200);
  }

  function replyFor(text) {
    const req = reqOf();
    const role = state.role;
    const tool = toolMsg('workbench_design_context', '读取当前需求与画布', '0.3s', `${req.code} · ${req.doc.version} · ${req.screens.length} 屏 · 验收 ${req.acceptance.length} 条`);
    if (/交付/.test(text)) {
      if (req.code === 'S13-001' && !req.design.delivered) {
        return [tool, aiMsg('收到。d2 草稿包含空态更新，我建议先交付再进入验收；交付记录会同步给李四。'), actionCard({ icon: 'i-upload', title: '可以交付 d2', meta: '3 屏 · 8 个文件 · 将替换 d1', actions: [{ label: '现在交付', act: 'deliver', primary: true }] })];
      }
      return [tool, aiMsg('这个需求的交付版本已经是最新。再改会生成新的草稿版本，不会覆盖已交付记录。')];
    }
    if (/验收|标准/.test(text)) {
      return [tool, aiMsg(req.code === 'S13-001' ? '设计 d2 交付后，验收清单会逐条解锁。现在可以先看第 1、4 条，它们已在 d1 上满足。' : '验收清单 4 条，2 条已预填通过，失败页的替代商品价格还需要你确认。')];
    }
    if (/空态|插画/.test(text)) {
      return [tool, aiMsg('我会沿用积分币插画和「去赚积分」入口，只调整文案层级与留白。改动写进 d2 草稿，不影响已交付的 d1。')];
    }
    if (/对比|差异/.test(text)) {
      return [aiMsg('切到「对比 d0」就能看到变化：d1 增加了余额概览、过期置灰和类型筛选；空态在 d2 草稿里重做。')];
    }
    if (/原型/.test(text)) {
      return [tool, aiMsg('原型 3 屏已确认，信息结构可以直接作为设计输入。需要我把某一屏的结构再拆细吗？')];
    }
    if (role === 'wangwu') return [tool, aiMsg('收到。我会先读取当前画板和 d1 的交付记录，再按你的描述改；改动只写进草稿，交付前不影响其他人。')];
    if (role === 'lisi') return [tool, aiMsg('收到。我把这条意见同步到需求动态，王五的设计会话会收到通知；画布上的评论也会留在这块屏幕的位置上。')];
    return [tool, aiMsg('收到。我把它放进你的待办，并在评审前提醒你；所有改动先落到需求状态，再同步到每个人的会话。')];
  }

  /* ============================ 交付 / 验收 ============================ */
  function openDeliver() {
    const req = REQS['S13-001'];
    if (state.role !== 'wangwu') { toast('设计由王五交付 · 可切换到王五体验', 'err'); return; }
    if (req.design.delivered || !req.design.draft) { toast('当前没有待交付的草稿', 'err'); return; }
    const files = fileData(req);
    const rows = files.pages.concat(files.support).map((f) => `<div class="file-row"><svg class="ic"><use href="icons.svg#${f.icon}"></use></svg><span class="fn">${f.n}</span><span class="fs">${f.size}</span></div>`).join('');
    openModal(`
      <div class="modal-hd"><div><div class="t">交付设计</div><div class="s">${req.code} · ${req.name} · 王五</div></div><button class="x" data-act="closeOverlay" title="关闭"><svg class="ic"><use href="icons.svg#i-x"></use></svg></button></div>
      <div class="modal-bd">
        <div class="deliver-top"><span class="vb">d2</span><div><div class="dt">用 d2 替换 d1</div><div class="ds">3 屏 · 8 个文件 · 包含空态重做与对比度修正</div></div><span class="r chip chip--warn">未交付</span></div>
        <div class="deliver-files">${rows}</div>
        <div class="field-label">版本说明（会写进版本记录与需求动态）</div>
        <textarea class="textarea" id="deliverNote">空态重做：更换积分币插画，补充「去赚积分」入口；过期行对比度提升到 3.2:1。</textarea>
        <div class="modal-row"><span class="cbox on"><svg class="ic"><use href="icons.svg#i-check"></use></svg></span>交付后通知李四验收，并让所有参与人看到新版本</div>
      </div>
      <div class="modal-ft"><span class="chip chip--plain">服务端校验 · 文件与画布一致</span><span class="sp"></span><button class="btn btn-sm btn-ghost" data-act="closeOverlay">取消</button><button class="btn btn-sm btn-primary" data-act="confirmDeliver">确认交付 d2</button></div>
    `);
  }

  function deliverDesign() {
    const req = REQS['S13-001'];
    if (!req.design.draft || req.design.delivered) { closeOverlay(); return; }
    req.design.latest = req.design.draft;
    req.design.draft = null;
    req.design.delivered = true;
    req.design.state = '已交付 · 待验收';
    req.design.at = '刚刚';
    req.status = { label: '待验收', kind: 'warn' };
    req.stageInfo.design = { state: 'done', sub: 'd2 · 已交付' };
    req.stageInfo.review = { state: 'doing', sub: '待李四验收' };
    req.stageInfo.dev = { state: 'idle', sub: '等待验收' };
    req.screens.forEach((s) => { s.meta = 'd2 · 王五 · 刚刚'; delete s.tag; });
    req.activity.unshift({ who: '王五', av: 'av-3', text: '交付了设计 <b>d2</b>，8 个文件', time: '刚刚', act: 'stage:design' });
    Object.keys(CHATS).forEach((key) => {
      if (key.endsWith('|S13-001')) CHATS[key].push(sys('设计 d2 已交付 · 8 个文件 · 已通知李四验收', 'i-upload'));
    });
    state.stage = 'design';
    state.view = 'canvas';
    closeOverlay();
    render();
    toast('设计 d2 已交付，已通知李四验收');
  }

  function approveReq() {
    const req = reqOf();
    if (!req.design.delivered) { toast('设计尚未交付，不能验收', 'err'); return; }
    if (state.role === 'wangwu') { toast('验收由李四或张三执行 · 可切换身份体验', 'err'); return; }
    req.status = { label: '已通过', kind: 'done' };

  function togglePop(type, anchor) {
    if (state.pop === type && popEl) { closePop(); return; }
    closePop();
    popEl = document.createElement('div');

  function openSheet(title, sub, body, foot) {
    closePop();
    closeOverlay();
    const sheet = $('#sheet');
    sheet.innerHTML = `
      <div class="sheet-hd"><div><div class="t">${title}</div><div class="s">${sub}</div></div><button class="x" data-act="closeOverlay" title="关闭"><svg class="ic"><use href="icons.svg#i-x"></use></svg></button></div>
      <div class="sheet-body">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
    sheet.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
    $('#scrim').classList.add('show');
  }

  function openModal(html) {
    closePop();
    closeOverlay();
    $('#modal2').innerHTML = html;
    $('#modalWrap').classList.add('show');
    $('#scrim').classList.add('show');
  }

  function closeOverlay() {
    $('#scrim').classList.remove('show');
    $('#sheet').classList.remove('show');
    $('#sheet').setAttribute('aria-hidden', 'true');
    $('#modalWrap').classList.remove('show');

  function versionsFor(req) {
    const list = [];
    if (req.design.draft) {
      list.push({ v: req.design.draft, st: '草稿 · 未交付', chip: 'chip--warn', meta: '王五 · 今天 09:38 · 3 个文件', current: true });
    }
    list.push({ v: req.design.latest, st: '已交付', chip: 'chip--done', meta: `王五 · ${req.design.at} · ${req.screens.length} 个页面 + 支撑文件`, current: !req.design.draft });
    if (req.design.latest !== 'd1') {
      list.push({ v: 'd1', st: '已交付', chip: 'chip--done', meta: '王五 · 昨天 18:20 · 3 个页面 + 支撑文件', current: false });
    }
    list.push({ v: 'd0', st: '初稿 · 仅本地', chip: 'chip--plain', meta: '王五 · 11-23 17:40 · 未交付', current: false });

  function openVersions() {
    const req = reqOf();
    const rows = versionsFor(req).map((v) => `
      <div class="ver-item">
        <span class="ver-badge ${v.current ? 'cur' : ''}">${v.v}</span>
        <div class="ver-main"><div class="ver-t">${v.current ? '当前显示' : '历史版本'}<span class="chip ${v.chip}">${v.st}</span></div><div class="ver-s">${v.meta}</div></div>
        <div class="ver-a"><button data-act="verpreview">预览</button>${v.v !== 'd0' || req.code === 'S13-001' ? '<button data-act="vercompare">对比</button>' : ''}</div>

    openSheet('版本记录', `${req.code} · 设计稿 · ${req.screens.length} 屏`, rows + `<div class="sheet-note"><svg class="ic"><use href="icons.svg#i-shield"></use></svg><span>版本由服务端保存，画布、会话和验收引用的是同一份文件；草稿不会覆盖已交付版本。</span></div>`, `<button class="btn btn-sm btn-ghost" data-act="toast:版本对比已导出（示例）">导出对比</button><span class="sp"></span><button class="btn btn-sm btn-primary" data-act="closeOverlay">完成</button>`);
  }

  function openFiles() {
    const req = reqOf();
    const files = fileData(req);
    const group = (title, list) => `<div class="file-group"><h4>${title}</h4>${list.map((f) => `<div class="file-row"><svg class="ic"><use href="icons.svg#${f.icon}"></use></svg><span class="fn">${f.n}</span><span class="fs">${f.size}</span><button data-act="toast:演示稿：会打开交付文件预览">预览</button></div>`).join('')}</div>`;
    openSheet('交付文件', `${req.code} · ${req.design.latest} · ${req.filesN} 个文件`,
      group('页面（' + files.pages.length + '）', files.pages) + group('支撑文件（' + files.support.length + '）', files.support) +
      `<div class="sheet-note"><svg class="ic"><use href="icons.svg#i-package"></use></svg><span>页面所需 CSS / JS 与页面一起上传，预览时内联；这就是别人看到的样子。</span></div>`,
      `<button class="btn btn-sm btn-primary" data-act="toast:设计包 zip 已生成到 Downloads（示例）"><svg class="ic"><use href="icons.svg#i-download"></use></svg>下载设计包</button><span class="sp"></span><button class="btn btn-sm btn-ghost" data-act="closeOverlay">关闭</button>`);
  }

  /* ============================ Toast ============================ */
  function toast(msg, kind, ms) {
    const wrap = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind === 'err' ? 'err' : 'ok');
    el.innerHTML = `<svg class="ic"><use href="icons.svg#${kind === 'err' ? 'i-alert' : 'i-check-circle'}"></use></svg><span>${esc(msg)}</span>`;
    wrap.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 220);
    }, ms || 2800);
  }

  /* ============================ 动作分发 ============================ */
  function runAction(act) {
    if (!act) return;
    const parts = act.split('|');
    let openedPop = false;
    parts.forEach((p) => {
      if (p.indexOf('pop:') === 0) openedPop = true;
      doAction(p);
    });
    if (!openedPop) closePop();
  }

  function doAction(act) {
    if (!act) return;
    const idx = act.indexOf(':');
    const kind = idx === -1 ? act : act.slice(0, idx);
    const arg = idx === -1 ? '' : act.slice(idx + 1);
    const req = reqOf();

    switch (kind) {
      case 'next': runAction(getNext().act); break;
      case 'stage': setStage(arg); break;
      case 'req': setReq(arg); break;
      case 'role': setRole(arg); break;
      case 'screen': selectScreen(parseInt(arg, 10) || 0); break;
      case 'view':
        state.view = arg;
        state.compare = false;
        state.zoomAuto = true;
        renderCanvas();
        break;
      case 'zoom':
        if (arg === 'in') adjustZoom(0.1);
        else if (arg === 'out') adjustZoom(-0.1);
        else { state.zoomAuto = true; fitZoom(); }
        break;
      case 'annotate':
        state.annotate = !state.annotate;
        state.openPin = null;
        renderCanvas();
        break;
      case 'compare':
        state.stage = 'design';
        state.view = 'canvas';
        state.compare = !state.compare;
        state.zoomAuto = false;
        render();
        break;
      case 'deliver': openDeliver(); break;
      case 'confirmDeliver': deliverDesign(); break;
      case 'approve': approveReq(); break;
      case 'reject': rejectReq(); break;
      case 'itempass':
        if (!canApprove() || state.role === 'wangwu') { toast('验收由李四或张三执行', 'err'); break; }
        req.acceptance[parseInt(arg, 10)].state = 'pass';
        renderCanvas();
        break;
      case 'itemwarn':
        if (!canApprove() || state.role === 'wangwu') { toast('验收由李四或张三执行', 'err'); break; }
        req.acceptance[parseInt(arg, 10)].state = 'warn';
        renderCanvas();
        break;
      case 'composer':
        focusComposer(arg);
        break;
      case 'focusComposer':
        focusComposer('');
        break;
      case 'pinclose':
        state.openPin = null;
        renderCanvas();
        break;
      case 'versions': openVersions(); break;
      case 'files': openFiles(); break;
      case 'verpreview':
        closeOverlay();
        state.stage = 'design';
        state.view = 'canvas';
        state.compare = false;
        state.screen = 0;
        render();
        toast('已回到画布 · 预览当前版本');
        break;
      case 'vercompare':
        closeOverlay();
        state.stage = 'design';
        state.view = 'canvas';
        state.compare = true;
        render();
        break;
      case 'pop':
        togglePop(arg, arg === 'todo' ? $('#todoBtn') : $('#iterBtn'));
        break;
      case 'readall':
        state.notifRead = true;
        renderTop();
        closePop();
        toast('通知已全部标记为已读');
        break;
      case 'closeOverlay': closeOverlay(); break;
      case 'editdoc':
        toast(isEditable() ? '演示稿：活文档编辑会保存为新版本，并同步给所有人' : '当前身份只读 · 可切换到李四体验', isEditable() ? 'ok' : 'err');
        break;
      case 'confirmproto':
        toast(state.role === 'lisi' ? '原型已确认（示例）· 设计输入已锁定' : '原型由产品确认 · 可切换到李四体验', state.role === 'lisi' ? 'ok' : 'err');
        break;
      case 'devstart':
        if (req.status.label !== '已通过') { toast('验收通过后才能创建开发会话', 'err'); break; }
        toast('演示稿：会为赵六创建开发会话，并带上设计 ' + req.design.latest + ' 与验收标准');
        break;
      case 'toast':
        toast(arg);
        break;
      default:
        break;
    }
  }

  function focusComposer(prefill) {
    state.dockCollapsed = false;
    state.dockTab = 'chat';
    render();
    const ta = $('#composerInput');
    if (prefill) ta.value = prefill;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  /* ============================ 事件 ============================ */
  document.addEventListener('click', function (e) {
    const actEl = e.target.closest('[data-act]');
    if (actEl) {
      e.preventDefault();
      e.stopImmediatePropagation();
      runAction(actEl.dataset.act);
      return;
    }
    const dockTab = e.target.closest('[data-docktab]');
    if (dockTab) {
      state.dockTab = dockTab.dataset.docktab;
      renderDock();
      return;
    }
    const screenEl = e.target.closest('[data-screen]');
    if (screenEl) {
      selectScreen(parseInt(screenEl.dataset.screen, 10) || 0);
      return;
    }
    const stageEl = e.target.closest('[data-stage]');
    if (stageEl) {
      setStage(stageEl.dataset.stage);
      return;
    }
    const pin = e.target.closest('.pin');
    if (pin) {
      e.stopPropagation();
      togglePin(parseInt(pin.dataset.pin, 10) || 0);
      return;
    }
    if (e.target.closest('.ab') && !e.target.closest('.pin-card')) {
      if (state.openPin !== null) {
        state.openPin = null;
        renderCanvas();
      }
    }
  });

  document.addEventListener('click', function (e) {
    if (!popEl) return;
    if (e.target.closest('#pop')) return;
    closePop();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (popEl) { closePop(); return; }
      if ($('#modalWrap').classList.contains('show') || $('#sheet').classList.contains('show')) { closeOverlay(); return; }
      if (state.openPin !== null) { state.openPin = null; renderCanvas(); }
    }
  });

  function bindPopAnchor(el, type) {
    if (!el) return;
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      togglePop(type, el);
    });
  }

  bindPopAnchor($('#reqBtn'), 'req');
  bindPopAnchor($('#todoBtn'), 'todo');
  bindPopAnchor($('#bellBtn'), 'notif');
  bindPopAnchor($('#roleBtn'), 'role');
  bindPopAnchor($('#gbarIter'), 'iter');
  bindPopAnchor($('#gbarTodo'), 'todo');
  bindPopAnchor($('#gbarRole'), 'role');

  $('#nextBtn').addEventListener('click', function () { runAction(getNext().act); });

  $('#chatBody').addEventListener('scroll', function () {
    $('#chatBody').classList.toggle('scrolled', $('#chatBody').scrollTop > 2);
  });
  $('#scrim').addEventListener('click', closeOverlay);
  $('#themeBtn').addEventListener('click', function () {
    const root = document.documentElement;
    const light = root.dataset.theme === 'light';
    root.dataset.theme = light ? 'dark' : 'light';
    $('#themeIcon').innerHTML = `<use href="icons.svg#${light ? 'i-sun' : 'i-moon'}"></use>`;
  });
  $('#settingsBtn').addEventListener('click', function () {
    toast('演示稿：设置面板会并入这个画布的侧栏');
  });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if ((state.stage === 'design' || state.stage === 'proto') && state.view === 'canvas' && !state.compare && state.zoomAuto) fitZoom();
    }, 120);
  });
