services:
  postgres:
    image: postgres:16-alpine
    container_name: dsh-workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置该变量（见 .env.example）}
    volumes:
      - workbench-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20

  workbench-server:
    build:
      context: ./server
    image: dsh-workbench-server:0.1.0
    container_name: dsh-workbench-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # 只发布到宿主机回环地址，局域网无法直接访问。
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-3210}:3210"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "3210"
      # 容器内必须监听 0.0.0.0 才能被 Docker 端口映射转发；对外暴露范围由上面的 127.0.0.1 限制。
      WORKBENCH_BIND_ADDR: "0.0.0.0"
      DATABASE_URL: postgres://workbench:${POSTGRES_PASSWORD:?请在 .env 中设置该变量（见 .env.example）}@postgres:5432/workbench
      WORKBENCH_AUTH_PROVIDER: ${WORKBENCH_AUTH_PROVIDER:-mock}
      WORKBENCH_AUTH_SECRET: ${WORKBENCH_AUTH_SECRET:?请在 .env 中设置该变量（见 .env.example）}
      WORKBENCH_INTERNAL_TOKEN: ${WORKBENCH_INTERNAL_TOKEN:?请在 .env 中设置该变量（见 .env.example）}
      WORKBENCH_TOKEN_TTL_SECONDS: ${WORKBENCH_TOKEN_TTL_SECONDS:-604800}
      WORKBENCH_PUBLIC_URL: ${WORKBENCH_PUBLIC_URL:-}
      WORKBENCH_ALLOWED_ORIGINS: ${WORKBENCH_ALLOWED_ORIGINS:-}
      # DSH 宿主从宿主机经回环端口访问容器，容器看到的来源是 Docker 网关而非 127.0.0.1；
      # 因此需要允许非回环来源携带内部令牌。端口本身只绑定 127.0.0.1。
      WORKBENCH_INTERNAL_ALLOW_REMOTE: "1"
      WORKBENCH_COOKIE_SECURE: ${WORKBENCH_COOKIE_SECURE:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID:-}
      DINGTALK_WORK_NOTIFY: ${DINGTALK_WORK_NOTIFY:-0}
      DINGTALK_API_BASE: ${DINGTALK_API_BASE:-https://oapi.dingtalk.com}
      DINGTALK_OAUTH_BASE: ${DINGTALK_OAUTH_BASE:-https://api.dingtalk.com}
      DINGTALK_DEFAULT_ROLES: ${DINGTALK_DEFAULT_ROLES:-dev}
      DINGTALK_SYNC_ROOT_DEPT: ${DINGTALK_SYNC_ROOT_DEPT:-1}
      DINGTALK_SYNC_DISABLE_MISSING: ${DINGTALK_SYNC_DISABLE_MISSING:-0}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_DEFAULT_BRANCH: ${GITLAB_DEFAULT_BRANCH:-main}
      RUST_LOG: ${RUST_LOG:-dsh_workbench_server=info,tower_http=info}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3210/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  workbench-pg:
