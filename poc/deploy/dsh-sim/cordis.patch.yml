# Headless simulation profile: Hy4 Flash through the host Magpie gateway.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      magpie:
        displayName: Magpie
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-completions
        baseURL: http://host.docker.internal:3425/v1
        models:
          - id: auto/hy4flash-free
            name: Hy4 flash · routing group
            contextWindow: 960000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts:
              high: high
        streamIdleTimeoutMs: 600000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: magpie
    model: auto/hy4flash-free
