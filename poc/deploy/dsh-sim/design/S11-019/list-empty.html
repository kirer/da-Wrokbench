<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="web 1440x900">
<title>订单列表空态 · 订单中心</title>
<style>
  :root{
    --primary:#2f6fed; --primary-hover:#2559c9; --primary-soft:#eaf1ff;
    --bg:#f5f7fa; --surface:#fff; --text:#1f2329; --muted:#646a73;
    --line:#e5e8ed; --line-soft:#f0f2f5; --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:10px}
  .logo{width:28px;height:28px;border-radius:7px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .logo::after{content:"";width:12px;height:12px;border:2px solid #fff;border-radius:3px}
  .brand{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .spacer{flex:1}
  .user{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
  .main{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
  .pagehead{margin-bottom:20px}
  .pagehead h2{font-size:20px;font-weight:600;line-height:1.3}
  .pagehead p{color:var(--muted);font-size:13px;margin-top:4px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .filters{padding:20px;margin-bottom:16px}
  .filter-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  .input,.select{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:14px;background:#fff;color:var(--text);outline:none;font-family:inherit}
  .input::placeholder{color:#a4abb5}
  .input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .input.search{width:240px}
  .range{display:flex;align-items:center;gap:8px}
  .range .input{width:150px}
  .range span{color:var(--muted);font-size:13px}
  .btn{height:36px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
  .btn:hover{border-color:#c9ced6;background:#fafbfc}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
  .actions{display:flex;gap:10px;margin-left:auto}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .chips-label{font-size:12px;color:var(--muted);margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:13px}
  .chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;font-family:inherit}
  .chip button:hover{background:rgba(47,111,237,.12)}
  .clear-all{border:0;background:transparent;color:var(--primary);font-size:13px;cursor:pointer;font-family:inherit;padding:4px}
  .clear-all:hover{text-decoration:underline}
  .resultbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
  .resultbar strong{color:var(--text);font-weight:600}
  .empty{padding:72px 20px 84px;text-align:center}
  .empty svg{display:block;margin:0 auto 20px}
  .empty h3{font-size:16px;font-weight:600;line-height:1.4}
  .empty p{color:var(--muted);font-size:13px;margin-top:8px}
  .empty .btn{margin-top:22px}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  @media(max-width:900px){
    .topbar{padding:0 16px}
    .main{padding:20px 16px 48px}
    .input.search{width:100%}
    .field,.range{width:100%}
    .range .input{flex:1;width:auto}
    .actions{margin-left:0;width:100%}
    .actions .btn{flex:1}
    .empty{padding:56px 16px 64px}
  }
</style>
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand">订单中心</span>
    <span class="spacer"></span>
    <span class="user"><span class="avatar" aria-hidden="true">王</span>王五</span>
  </header>

  <main class="main">
    <div class="pagehead">
      <h2>订单列表</h2>
      <p>查看并管理店铺内的全部订单</p>
    </div>

    <section class="card filters" aria-label="订单筛选">
      <div class="filter-row">
        <div class="field">
          <label for="keyword">关键词</label>
          <input id="keyword" class="input search" type="search" placeholder="搜索订单编号 / 商品名称">
        </div>
        <div class="field">
          <label for="status">订单状态</label>
          <select id="status" class="select">
            <option>全部</option>
            <option>待付款</option>
            <option>待发货</option>
            <option selected>已完成</option>
          </select>
        </div>
        <div class="field">
          <label>下单时间</label>
          <div class="range">
            <input class="input" type="date" value="2026-11-16" aria-label="开始日期">
            <span>至</span>
            <input class="input" type="date" value="2026-11-22" aria-label="结束日期">
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="reset">重置</button>
          <button class="btn btn-primary" type="button">查询</button>
        </div>
      </div>
      <div class="chips">
        <span class="chips-label">已选条件</span>
        <span class="chip">已完成<button type="button" aria-label="移除已完成条件">×</button></span>
        <span class="chip">近 7 天<button type="button" aria-label="移除近 7 天条件">×</button></span>
        <button class="clear-all" type="button" id="clearAll">清除全部</button>
      </div>
    </section>

    <section class="card">
      <div class="resultbar">
        <span>共 <strong>0</strong> 条订单</span>
        <span>已按所选条件筛选</span>
      </div>
      <div class="empty">
        <svg width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="空订单插画">
          <rect x="20" y="26" width="62" height="56" rx="8" fill="#F1F5FB"/>
          <rect x="28" y="18" width="46" height="16" rx="5" fill="#E3EBF7"/>
          <path d="M31 46h22M31 56h30M31 66h18" stroke="#C4D2E8" stroke-width="4" stroke-linecap="round"/>
          <circle cx="76" cy="72" r="18" fill="#FFFFFF" stroke="#2f6fed" stroke-width="3"/>
          <path d="M89 85l10 10" stroke="#2f6fed" stroke-width="4" stroke-linecap="round"/>
          <path d="M69 72h14" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
          <path d="M76 65v14" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h3>没有符合条件的订单</h3>
        <p>当前筛选条件下暂无订单，试试调整状态或时间范围</p>
        <button class="btn btn-primary" type="button" id="clearFilter">清除筛选</button>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('reset').addEventListener('click', function () {
      document.querySelectorAll('input[type="search"], input[type="date"]').forEach(function (el) { el.value = ''; });
      document.querySelector('select').selectedIndex = 0;
    });
    document.querySelectorAll('.chip button').forEach(function (btn) {
      btn.addEventListener('click', function () { btn.closest('.chip').remove(); });
    });
    document.getElementById('clearAll').addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (chip) { chip.remove(); });
    });
    document.getElementById('clearFilter').addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (chip) { chip.remove(); });
      document.querySelectorAll('input[type="search"], input[type="date"]').forEach(function (el) { el.value = ''; });
      document.querySelector('select').selectedIndex = 0;
    });
  </script>
</body>
</html>
