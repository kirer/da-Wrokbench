# 本地 GitLab CE，用于工作台真实 GitLab 集成验证。
# 启动：cp ../../.local/gitlab.env.example ../../.local/gitlab.env
#       docker compose --env-file ../../.local/gitlab.env up -d gitlab
# 详见 README.md。
name: dsh-gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:17.11.4-ce.0
    container_name: dsh-gitlab
    hostname: gitlab.local
    restart: unless-stopped
    shm_size: "256m"
    mem_limit: 5g
    cpus: 2.0
    # 仅绑定宿主机回环地址；GitLab 管理面不要暴露到局域网。
    ports:
      - "127.0.0.1:8929:8929"
      - "127.0.0.1:2224:22"
    environment:
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL:-admin@example.com}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?请在 .local/gitlab.env 设置 GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:8929'
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        package['modify_kernel_parameters'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false
        gitlab_pages['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8929/-/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    networks:
      - gitlab-net

  runner:
    image: gitlab/gitlab-runner:v17.11.0
    container_name: dsh-gitlab-runner
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      CI_SERVER_URL: http://gitlab:8929
      RUNNER_DOCKER_IMAGE: ${RUNNER_DOCKER_IMAGE:-node:20-alpine}
      RUNNER_DOCKER_NETWORK_MODE: dsh-gitlab-net
      RUNNER_DOCKER_PULL_POLICY: if-not-present
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -n "$$RUNNER_TOKEN" ] && { ! grep -q "token = $$RUNNER_TOKEN" /etc/gitlab-runner/config.toml 2>/dev/null || ! grep -q 'clone_url = ' /etc/gitlab-runner/config.toml; }; then
          rm -f /etc/gitlab-runner/config.toml
          gitlab-runner register --non-interactive \
            --url "$$CI_SERVER_URL" \
            --clone-url "$$CI_SERVER_URL" \
            --token "$$RUNNER_TOKEN" \
            --executor docker \
            --docker-image "$$RUNNER_DOCKER_IMAGE" \
            --docker-network-mode "$$RUNNER_DOCKER_NETWORK_MODE" \
            --docker-pull-policy "$$RUNNER_DOCKER_PULL_POLICY" \
            --description "dsh-gitlab-runner"
        fi
        exec gitlab-runner run --working-directory=/home/gitlab-runner
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      # Docker executor 需要 Docker socket；挂载后 runner 等同宿主机 root 权限，
      # 仅用于本地验证环境，生产请改用隔离 runner 或 Kubernetes executor。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitlab-net

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  gitlab-runner-config:

networks:
  gitlab-net:
    name: dsh-gitlab-net
